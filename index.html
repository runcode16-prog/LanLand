<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LanLand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F2F5FA;--ink:#0F1730;--mute:#667089;--line:#E3E8F1;--card:#fff;--pri:#2C46F0;--en:#2C46F0;--zh:#D8433A;--fr:#12806F;--de:#C4850A;--r:18px}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 Onest,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:Unbounded,Onest,sans-serif;font-weight:500;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #9AA8FF;outline-offset:2px}
.hide{display:none!important}
/* auth */
#auth{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr}
.hero{padding:48px 6vw;display:flex;flex-direction:column;justify-content:space-between;background:#E8EDFB}
.logo{font-size:22px;display:flex;align-items:center;gap:10px}
.mark{display:grid;grid-template-columns:repeat(2,10px);gap:3px}
.mark i{width:10px;height:10px;border-radius:3px}
.mark i:nth-child(1){background:var(--en)}.mark i:nth-child(2){background:var(--zh)}.mark i:nth-child(3){background:var(--fr)}.mark i:nth-child(4){background:var(--de)}
#greet{font-family:Unbounded,sans-serif;font-weight:600;font-size:clamp(52px,9vw,128px);line-height:1;letter-spacing:-.04em;transition:opacity .35s,transform .35s}
#greet.out{opacity:0;transform:translateY(14px)}
.cap{color:var(--mute);margin-top:14px;font-weight:500}
.tag{max-width:30ch;color:var(--mute);font-size:17px}
.formside{display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:100%;max-width:380px}
.tabs{display:flex;gap:4px;background:#E8ECF4;padding:4px;border-radius:12px;margin:22px 0}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;color:var(--mute);font-weight:500}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,48,.12)}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:500}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.btn{border:0;background:var(--pri);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{box-shadow:0 6px 16px rgba(44,70,240,.28)}.btn:active{transform:scale(.98)}
.btn.full{width:100%;margin-top:22px;padding:13px}
.btn.ghost{background:#EEF1FB;color:var(--pri)}.btn.ghost:hover{box-shadow:none;background:#E2E7FB}
.btn.del{background:none;color:var(--zh);padding:6px 10px}.btn.del:hover{box-shadow:none;background:#FCEBEA}
.msg{margin-top:14px;font-size:14px;color:var(--zh);min-height:20px}.msg.ok{color:var(--fr)}
/* app */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
nav{display:flex;flex-direction:column;gap:2px}
nav button{text-align:left;border:0;background:none;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:500;color:var(--mute)}
nav button:hover{background:#F2F5FA;color:var(--ink)}
nav button.on{background:#EAEEFE;color:var(--pri)}
.who{margin-top:auto;padding:12px 14px;border-radius:14px;background:#F2F5FA;font-size:13px}
.who b{display:block;font-size:14px}.who span{color:var(--mute)}
main{padding:36px clamp(18px,4vw,48px);max-width:1040px;width:100%}
main>h1{font-size:28px;margin-bottom:6px}.sub{color:var(--mute);margin-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(15,23,48,.04),0 8px 24px -12px rgba(15,23,48,.08);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.grid .card{margin:0}
.big{font-family:Unbounded,sans-serif;font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.lbl{color:var(--mute);font-size:13px;font-weight:500}
h3{font-size:16px;margin-bottom:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.dot.en,.c-en{background:var(--en)}.dot.zh,.c-zh{background:var(--zh)}.dot.fr,.c-fr{background:var(--fr)}.dot.de,.c-de{background:var(--de)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}.row small{color:var(--mute);display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:#F2F5FA;font-weight:600;font-size:14px;white-space:nowrap}
.pill.kr{background:#EAEEFE;color:var(--pri)}
.day{font-family:Unbounded,sans-serif;font-size:14px;margin:22px 0 10px;text-transform:capitalize}
.chain{padding:6px 20px}
.chain .row{gap:16px}
.time{font-weight:600;width:112px;font-variant-numeric:tabular-nums}
.bar{width:4px;align-self:stretch;border-radius:4px}
.empty{color:var(--mute);padding:18px 0}
details.card summary{cursor:pointer;font-weight:600;color:var(--pri);list-style:none}
details.card[open] summary{margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.chk label{display:flex;align-items:center;gap:7px;margin:0;color:var(--ink);font-size:14px}
.chk input{width:auto}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:500;z-index:9;transition:opacity .25s}
@media(max-width:820px){
#auth{grid-template-columns:1fr}.hero{padding:28px 24px;gap:36px}
#app{grid-template-columns:1fr}
aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:5;border:0;border-top:1px solid var(--line)}
aside .logo,.who{display:none}
nav{flex-direction:row;overflow-x:auto;width:100%}nav button{white-space:nowrap;padding:10px 12px;font-size:13px}
main{padding:24px 16px 96px}.two{grid-template-columns:1fr}.time{width:92px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="auth" class="hide">
  <div class="hero">
    <div class="logo"><span class="mark"><i></i><i></i><i></i><i></i></span>LanLand</div>
    <div><div id="greet">Hello</div><div class="cap" id="gcap">Английский</div></div>
    <p class="tag">Школа иностранных языков. Расписание, оценки и домашние задания в одном месте.</p>
  </div>
  <div class="formside"><div class="box">
    <h2 style="font-size:24px">Добро пожаловать</h2>
    <p style="color:var(--mute);margin-top:6px">Войдите с данными, которые выдала школа.</p>
    <form id="authForm" style="margin-top:10px">
      <label for="aMail">Электронная почта</label><input id="aMail" type="email" required autocomplete="email">
      <label for="aPass">Пароль</label><input id="aPass" type="password" minlength="6" required autocomplete="current-password">
      <button class="btn full" id="aBtn">Войти</button>
      <div class="msg" id="aMsg" role="alert"></div>
    </form>
  </div></div>
</section>

<div id="app" class="hide">
  <aside>
    <div class="logo"><span class="mark"><i></i><i></i><i></i><i></i></span>LanLand</div>
    <nav id="nav"></nav>
    <div class="who"><b id="wName"></b><span id="wRole"></span></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="hide" role="status"></div>

<script>
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LANG = {}, LGK = {};   // заполняются из таблицы languages
const KIND = {'ДЗ':['ДЗ',1], 'Тест':['Тест',1.5], 'Р/У':['Р/У',1], 'Проверочная':['Проверочная',2], 'КР':['КР',3]};
const ROLE = {student:'Ученик', teacher:'Учитель', admin:'Администратор'};
const SUBST = {not_submitted:'Не сдано', submitted:'Сдано', checked:'Проверено', returned:'Возвращено'};
const $ = s => document.querySelector(s);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, P = {}, LG = [], LES = [], HW = [], GR = [], TL = [], SUB = [], G = {}, page = 'home', booting = false;

/* ---------- helpers ---------- */
const nm = id => P[id]?.full_name || 'Без имени';
const dot = l => `<i class="dot ${l}"></i>`;
const isStaff = () => me.role !== 'student';
const fmtT = d => new Date(d).toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
const fmtD = d => new Date(d).toLocaleDateString('ru', {weekday:'long', day:'numeric', month:'long'});
const fmtS = d => new Date(d + 'T00:00').toLocaleDateString('ru', {day:'numeric', month:'short'});
const avg = g => { let s = 0, w = 0; g.forEach(x => { const k = KIND[x.kind][1]; s += x.value * k; w += k; }); return w ? s / w : null; };
const f2 = n => n == null ? '—' : n.toFixed(2).replace('.', ',');
const gpill = g => `<span class="pill ${g.kind === 'kr' ? 'kr' : ''}">${g.value} — ${KIND[g.kind][0]}</span>`;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hide'), 2600); }
const myStudents = () => Object.values(P).filter(p => p.role === 'student').sort((a, b) => (a.full_name || '').localeCompare(b.full_name || ''));
const stOpts = () => myStudents().map(p => `<option value="${p.id}">${e(p.full_name)}</option>`).join('');
const lgOpts = () => Object.entries(LANG).filter(([k]) => me.role === 'admin' || me.langs.includes(k)).map(([k, v]) => `<option value="${k}">${e(v)}</option>`).join('');
const rowOf = (sid, k) => { const l = LGK[k]; return {student_id:sid, teacher_id:me.role === 'admin' ? (P[sid].teacher_id || me.id) : me.id, language:l ? l.name : k, language_id:l ? l.id : null}; };
async function tryIns(t, base, variants, ok){
  let err; for (const v of variants) { const {error} = await db.from(t).insert({...base, ...v}); if (!error) return refresh(ok); err = error; }
  toast(err.message);
}

/* ---------- auth screen ---------- */
const greets = [['Hello','en'],['你好','zh'],['Bonjour','fr'],['Hallo','de']];
const gcol = {en:'var(--en)', zh:'var(--zh)', fr:'var(--fr)', de:'var(--de)'};
let gi = 0;
function setGreet(){ const [t,l] = greets[gi]; const g = $('#greet'); g.textContent = t; g.style.color = gcol[l]; $('#gcap').textContent = LANG[l]; }
setInterval(() => { if ($('#auth').classList.contains('hide')) return; const g = $('#greet'); g.classList.add('out'); setTimeout(() => { gi = (gi + 1) % 4; setGreet(); g.classList.remove('out'); }, 350); }, 2800);
setGreet();

$('#authForm').onsubmit = async ev => {
  ev.preventDefault(); const msg = $('#aMsg'); msg.className = 'msg'; msg.textContent = '';
  const email = $('#aMail').value.trim(), password = $('#aPass').value;
  try {
    const {error} = await db.auth.signInWithPassword({email, password}); if (error) throw error;
  } catch (err) {
    msg.textContent = /Invalid login/i.test(err.message) ? 'Неверная почта или пароль.' : err.message;
  }
};
const showAuth = () => { $('#app').classList.add('hide'); $('#auth').classList.remove('hide'); };

/* ---------- data ---------- */
async function load(){
  const r = await Promise.all([
    db.from('profiles').select('*'), db.from('languages').select('*'), db.from('schedule').select('*'),
    db.from('homework').select('*'), db.from('grades').select('*').order('created_at', {ascending:false}),
    db.from('teacher_languages').select('*'), db.from('homework_submissions').select('*'), db.from('groups').select('id,name')]);
  const bad = r.slice(0, 7).find(x => x.error); if (bad) throw bad.error;
  const kc = c => { c = String(c || '').toLowerCase().slice(0, 2); return c === 'cn' ? 'zh' : c; };
  LG = r[1].data; [LANG, LGK].forEach(o => Object.keys(o).forEach(k => delete o[k]));
  LG.forEach(l => { l.key = kc(l.code) || l.name; LGK[l.key] = l; LANG[l.key] = l.name; });
  const key = x => {
    const l = LG.find(g => g.id === x.language_id) || (x.language && LG.find(g => g.name === x.language || kc(g.code) === kc(x.language)));
    const k = l ? l.key : (x.language || '—'); if (!LANG[k]) LANG[k] = x.language || k; return k;
  };
  P = Object.fromEntries(r[0].data.map(x => [x.id, x]));
  SUB = r[6].data; G = Object.fromEntries((r[7].data || []).map(g => [g.id, g.name]));
  const st = h => (SUB.find(s => s.homework_id === h.id && s.student_id === h.student_id) || {}).status || 'not_submitted';
  LES = r[2].data.filter(l => (l.lesson_date || l.date) && l.start_time && l.end_time).map(l => { const d = l.lesson_date || l.date; return {...l, language:key(l), starts_at:`${d}T${l.start_time}`, ends_at:`${d}T${l.end_time}`}; })
    .sort((a, b) => a.starts_at < b.starts_at ? -1 : 1);
  HW = r[3].data.map(h => ({...h, language:key(h), due_on:h.due_date, assigned_on:(h.created_at || '').slice(0, 10), status:st(h)}))
    .sort((a, b) => String(a.due_on) < String(b.due_on) ? -1 : 1);
  GR = r[4].data.map(g => { const k = g.grade_type || g.type || '—'; if (!KIND[k]) KIND[k] = [k, 1]; return {...g, language:key(g), kind:k, value:g.value ?? g.grade}; });
  TL = r[5].data.map(t => ({...t, language:(LG.find(l => l.id === t.language_id) || {}).key})).filter(t => t.language);
  if (me) {
    me.langs = TL.filter(t => t.teacher_id === me.id).map(t => t.language);
    if (!me.langs.length && Array.isArray(me.languages)) me.langs = me.languages.map(n => key({language:n}));
  }
}
async function boot(){
  if (booting) return; booting = true;
  try {
    const {data:{session}} = await db.auth.getSession();
    if (!session) { me = null; showAuth(); return; }
    const {data:pr, error} = await db.from('profiles').select('*').eq('id', session.user.id).single();
    if (error || !pr) throw error || new Error('Профиль не найден');
    me = pr; await load(); showApp();
  } catch (err) {
    showAuth(); const m = $('#aMsg'); m.className = 'msg'; m.textContent = 'Не удалось загрузить данные: ' + err.message;
  } finally { booting = false; }
}
db.auth.onAuthStateChange((ev, s) => {
  if (ev === 'SIGNED_OUT') { me = null; showAuth(); }
  else if (ev === 'SIGNED_IN' && (!me || me.id !== s.user.id)) setTimeout(boot, 0);
});

/* ---------- shell ---------- */
function navItems(){
  const n = [['home','Главная'],['schedule','Расписание'],['grades','Оценки'],['homework','Домашняя работа']];
  if (isStaff()) n.push(['students','Ученики']);
  if (me.role === 'admin') n.push(['teachers','Учителя'],['users','Пользователи']);
  n.push(['settings','Настройки']); return n;
}
function showApp(){
  $('#auth').classList.add('hide'); $('#app').classList.remove('hide');
  $('#wName').textContent = me.full_name || 'Без имени';
  $('#wRole').textContent = ROLE[me.role] + (me.role === 'teacher' && me.langs.length ? ' · ' + me.langs.map(l => LANG[l]).join(', ') : '');
  if (!navItems().some(x => x[0] === page)) page = 'home';
  go(page);
}
function go(p){
  page = p;
  $('#nav').innerHTML = navItems().map(([k,t]) => `<button class="${k === p ? 'on' : ''}" onclick="go('${k}')">${t}</button>`).join('');
  $('#main').innerHTML = VIEWS[p](); window.scrollTo(0, 0);
}
async function refresh(t){ try { await load(); go(page); if (t) toast(t); } catch (err) { toast(err.message); } }
async function run(q, t){ const {error} = await q; if (error) return toast(error.message); refresh(t); }

/* ---------- schedule ---------- */
function chains(list){
  const out = [];
  list.forEach(l => {
    const c = out[out.length - 1], day = new Date(l.starts_at).toDateString();
    if (c && c.day === day && c.end === +new Date(l.starts_at)) { c.items.push(l); c.end = +new Date(l.ends_at); }
    else out.push({day, end:+new Date(l.ends_at), items:[l]});
  });
  return out;
}
const lessonWho = l => me.role === 'student' ? nm(l.teacher_id)
  : (l.group_id && !l.student_id ? 'Группа: ' + (G[l.group_id] || '') : (me.role === 'teacher' ? nm(l.student_id) : nm(l.teacher_id) + ' · ' + nm(l.student_id)));
function lessonRow(l){
  return `<div class="row"><span class="bar c-${l.language}"></span><div class="time">${fmtT(l.starts_at)}–${fmtT(l.ends_at)}</div>
  <div class="grow"><b>${e(LANG[l.language])}</b><small>${e(lessonWho(l))}${l.title ? ' · ' + e(l.title) : ''}</small></div>
  ${isStaff() ? `<button class="btn del" onclick="delRow('schedule','${l.id}')">Удалить</button>` : ''}</div>`;
}
function scheduleView(){
  const from = new Date(); from.setHours(0,0,0,0);
  const up = LES.filter(l => new Date(l.ends_at) >= from);
  let html = '<h1>Расписание</h1><p class="sub">Занятия по порядку. Уроки подряд собраны в одну группу.</p>';
  if (isStaff()) html += `<details class="card"><summary>Добавить занятие</summary><form onsubmit="return addLesson(event)">
    <div class="two"><div><label>Ученик</label><select name="st" required>${stOpts()}</select></div><div><label>Язык</label><select name="lg" required>${lgOpts()}</select></div>
    <div><label>Дата</label><input type="date" name="d" required></div><div></div>
    <div><label>Начало</label><input type="time" name="s" required></div><div><label>Окончание</label><input type="time" name="t" required></div></div>
    <button class="btn" style="margin-top:18px">Добавить занятие</button></form></details>`;
  if (!up.length) return html + '<div class="card empty">Занятий пока нет.</div>';
  let last = '';
  chains(up).forEach(c => {
    const d = fmtD(c.items[0].starts_at);
    if (d !== last) { html += `<div class="day">${d}</div>`; last = d; }
    html += `<div class="card chain">${c.items.map(lessonRow).join('')}</div>`;
  });
  return html;
}
function addLesson(ev){
  ev.preventDefault(); const f = new FormData(ev.target), d = f.get('d'), s = f.get('s'), t = f.get('t');
  if (t <= s) { toast('Окончание должно быть позже начала'); return false; }
  tryIns('schedule', {...rowOf(f.get('st'), f.get('lg')), start_time:s, end_time:t, created_by:me.id}, [{lesson_date:d, date:d}, {lesson_date:d}, {date:d}], 'Занятие добавлено');
  return false;
}
const delRow = (t, id) => confirm('Удалить запись?') && run(db.from(t).delete().eq('id', id), 'Удалено');

/* ---------- grades ---------- */
function gradesView(){
  let html = '<h1>Оценки</h1><p class="sub">Средний балл считается с учётом веса: КР — 3, Проверочная — 2, Тест — 1,5, Р/У и ДЗ — 1.</p>';
  if (isStaff()) html += `<details class="card"><summary>Выставить оценку</summary><form onsubmit="return addGrade(event)">
    <div class="two"><div><label>Ученик</label><select name="st" required>${stOpts()}</select></div><div><label>Язык</label><select name="lg" required>${lgOpts()}</select></div>
    <div><label>Тип</label><select name="kind">${['ДЗ','Тест','Р/У','Проверочная','КР'].map(k => `<option>${k}</option>`).join('')}</select></div>
    <div><label>Оценка</label><select name="v">${[5,4,3,2,1].map(n => `<option>${n}</option>`).join('')}</select></div></div>
    <label>Комментарий</label><input name="c" maxlength="200">
    <button class="btn" style="margin-top:18px">Сохранить оценку</button></form></details>`;
  if (!GR.length) return html + '<div class="card empty">Оценок пока нет.</div>';
  const by = {}; GR.forEach(g => (by[g.language] ||= []).push(g));
  Object.entries(by).forEach(([l, list]) => {
    html += `<div class="card"><div class="row" style="border:0;padding-top:0"><div class="grow"><h3 style="margin:0">${dot(l)}${e(LANG[l])}</h3></div><div class="lbl">Средний балл</div><div class="big" style="font-size:28px">${f2(avg(list))}</div></div>`;
    html += list.map(g => `<div class="row">${gpill(g)}<div class="grow">${isStaff() ? `<b>${e(nm(g.student_id))}</b>` : ''}<small>${e(g.comment || '')} ${new Date(g.created_at).toLocaleDateString('ru')}</small></div>
      ${isStaff() ? `<button class="btn del" onclick="delRow('grades','${g.id}')">Удалить</button>` : ''}</div>`).join('') + '</div>';
  });
  return html;
}
function addGrade(ev){
  ev.preventDefault(); const f = new FormData(ev.target), k = f.get('kind'), v = +f.get('v');
  tryIns('grades', {...rowOf(f.get('st'), f.get('lg')), comment:f.get('c') || null},
    [{grade_type:k, type:k, value:v, grade:v}, {grade_type:k, value:v}, {grade_type:k, grade:v}, {type:k, grade:v}, {type:k, value:v}], 'Оценка сохранена');
  return false;
}

/* ---------- homework ---------- */
function homeworkView(){
  const today = new Date().toISOString().slice(0, 10);
  let html = '<h1>Домашняя работа</h1><p class="sub">Задания, сроки и статус сдачи.</p>';
  if (isStaff()) html += `<details class="card"><summary>Создать задание</summary><form onsubmit="return addHw(event)">
    <label>Ученики</label><div class="chk" style="max-height:140px;overflow:auto">${myStudents().map(p => `<label><input type="checkbox" name="st" value="${p.id}">${e(p.full_name)}</label>`).join('') || '<span class="empty">Нет учеников</span>'}</div>
    <div class="two"><div><label>Язык</label><select name="lg" required>${lgOpts()}</select></div><div><label>Срок сдачи</label><input type="date" name="due" required></div></div>
    <label>Название</label><input name="title" required maxlength="120"><label>Описание</label><textarea name="desc" rows="3"></textarea>
    <button class="btn" style="margin-top:18px">Создать задание</button></form></details>`;
  if (!HW.length) return html + '<div class="card empty">Заданий пока нет.</div>';
  return html + HW.map(h => {
    const late = h.status === 'not_submitted' && h.due_on < today;
    const acts = isStaff()
      ? `${h.status === 'submitted' ? `<button class="btn ghost" onclick="setSub('${h.id}','checked')">Отметить проверенным</button><button class="btn ghost" onclick="setSub('${h.id}','returned')">Вернуть</button>` : ''}
         <button class="btn ghost" onclick="editHw('${h.id}')">Изменить</button><button class="btn del" onclick="delRow('homework','${h.id}')">Удалить</button>`
      : (h.status === 'not_submitted' || h.status === 'returned' ? `<button class="btn ghost" onclick="setSub('${h.id}','submitted')">Отметить сданной</button>` : '');
    return `<div class="card"><div class="row" style="border:0;padding:0 0 8px"><div class="grow"><h3 style="margin:0">${dot(h.language)}${e(h.title)}</h3>
      <small class="lbl">${e(LANG[h.language])}${isStaff() ? ' · ' + e(nm(h.student_id)) : ''}</small></div>
      <span class="pill">${late ? 'Просрочено' : SUBST[h.status]}</span></div>
      <p>${e(h.description || '')}</p><p class="lbl" style="margin-top:8px">Выдано ${h.assigned_on ? fmtS(h.assigned_on) : '—'} · срок сдачи ${h.due_on ? fmtS(h.due_on) : '—'}</p>
      ${acts.trim() ? `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${acts}</div>` : ''}</div>`;
  }).join('');
}
function addHw(ev){
  ev.preventDefault(); const f = new FormData(ev.target), ids = f.getAll('st');
  if (!ids.length) { toast('Выберите хотя бы одного ученика'); return false; }
  run(db.from('homework').insert(ids.map(id => ({...rowOf(id, f.get('lg')), title:f.get('title'), description:f.get('desc'), due_date:f.get('due')}))), 'Задание создано');
  return false;
}
function setSub(id, st){
  const h = HW.find(x => x.id === id), s = SUB.find(x => x.homework_id === id && x.student_id === h.student_id);
  const upd = {status:st}; if (st !== 'submitted') upd.checked_at = new Date().toISOString();
  run(s ? db.from('homework_submissions').update(upd).eq('id', s.id) : db.from('homework_submissions').insert({homework_id:id, student_id:h.student_id, status:st}), 'Статус обновлён');
}
function editHw(id){
  const h = HW.find(x => x.id === id), t = prompt('Название', h.title); if (t === null) return;
  const d = prompt('Описание', h.description || ''); if (d === null) return;
  const due = prompt('Срок сдачи (ГГГГ-ММ-ДД)', h.due_on); if (!due) return;
  run(db.from('homework').update({title:t, description:d, due_date:due}).eq('id', id), 'Изменения сохранены');
}

/* ---------- home ---------- */
function homeView(){
  const now = new Date(), today = now.toISOString().slice(0, 10);
  const next = LES.filter(l => new Date(l.ends_at) >= now).slice(0, 3);
  const open = HW.filter(h => h.status !== 'checked' && h.due_on >= today);
  const a = avg(GR);
  const stats = isStaff()
    ? `<div class="card"><div class="lbl">Учеников</div><div class="big">${myStudents().length}</div></div>`
    : `<div class="card"><div class="lbl">Средний балл</div><div class="big">${f2(a)}</div></div>`;
  return `<h1>Здравствуйте, ${e((me.full_name || '').split(' ')[0] || 'друг')}</h1><p class="sub">${ROLE[me.role]} LanLand</p>
  <div class="grid">${stats}<div class="card"><div class="lbl">Активных заданий</div><div class="big">${open.length}</div></div>
  <div class="card"><div class="lbl">Занятий впереди</div><div class="big">${LES.filter(l => new Date(l.ends_at) >= now).length}</div></div></div>
  <div class="day">Ближайшие занятия</div>
  ${next.length ? `<div class="card chain">${next.map(l => `<div class="row"><span class="bar c-${l.language}"></span><div class="time">${new Date(l.starts_at).toLocaleDateString('ru',{day:'numeric',month:'short'})}<small>${fmtT(l.starts_at)}</small></div><div class="grow"><b>${e(LANG[l.language])}</b><small>${e(lessonWho(l))}</small></div></div>`).join('')}</div>` : '<div class="card empty">Ближайших занятий нет.</div>'}`;
}

/* ---------- students / teachers / users ---------- */
function studentsView(){
  const list = myStudents();
  const html = '<h1>Ученики</h1><p class="sub">' + (me.role === 'admin' ? 'Все ученики школы.' : 'Только ваши ученики.') + '</p>';
  if (!list.length) return html + '<div class="card empty">Учеников пока нет.</div>';
  return html + '<div class="card">' + list.map(p => {
    const t = P[p.teacher_id], langs = (p.languages || []).map(l => `<span class="pill">${e(l)}</span>`).join(' ');
    return `<div class="row"><div class="grow"><b>${e(p.full_name)}</b><small>${me.role === 'admin' ? 'Учитель: ' + e(t ? t.full_name : 'не назначен') + ' ' : ''}${langs}</small></div>
      <div><span class="lbl">Средний балл</span> <b>${f2(avg(GR.filter(g => g.student_id === p.id)))}</b></div></div>`;
  }).join('') + '</div>';
}
function teachersView(){
  const ts = Object.values(P).filter(p => p.role === 'teacher'), st = myStudents();
  let html = '<h1>Учителя</h1><p class="sub">Языки учителей и назначение учеников.</p>';
  html += `<details class="card"><summary>Назначить ученика учителю</summary><form onsubmit="return addEnr(event)">
    <label>Ученик</label><select name="s" required>${stOpts()}</select>
    <label>Учитель</label><select name="t" required>${ts.map(p => `<option value="${p.id}">${e(p.full_name)}</option>`).join('')}</select>
    <button class="btn" style="margin-top:18px">Назначить</button></form></details>`;
  if (!ts.length) return html + '<div class="card empty">Нет учителей. Назначьте роль «Учитель» в разделе «Пользователи».</div>';
  return html + ts.map(t => `<div class="card"><h3>${e(t.full_name)}</h3><div class="lbl">Языки преподавания</div>
    <div class="chk">${Object.entries(LANG).map(([k,v]) => `<label><input type="checkbox" ${TL.some(x => x.teacher_id === t.id && x.language === k) ? 'checked' : ''} onchange="setLang('${t.id}','${k}',this.checked)">${dot(k)}${e(v)}</label>`).join('')}</div>
    <div class="lbl" style="margin-top:14px">Ученики</div>
    ${st.filter(x => x.teacher_id === t.id).map(x => `<div class="row"><div class="grow">${e(x.full_name)}</div><button class="btn del" onclick="unassign('${x.id}')">Открепить</button></div>`).join('') || '<div class="empty" style="padding:6px 0">Нет учеников</div>'}</div>`).join('');
}
const setLang = (t, k, on) => run(on ? db.from('teacher_languages').insert({teacher_id:t, language_id:LGK[k].id}) : db.from('teacher_languages').delete().eq('teacher_id', t).eq('language_id', LGK[k].id), 'Языки обновлены');
function addEnr(ev){ ev.preventDefault(); const f = new FormData(ev.target); run(db.from('profiles').update({teacher_id:f.get('t')}).eq('id', f.get('s')), 'Ученик назначен'); return false; }
const unassign = id => run(db.from('profiles').update({teacher_id:null}).eq('id', id), 'Ученик откреплён');
function usersView(){
  return `<h1>Пользователи</h1><p class="sub">Управление ролями.</p><div class="card">${Object.values(P).map(p => `<div class="row"><div class="grow"><b>${e(p.full_name)}</b></div>
    <select style="width:170px" onchange="setRole('${p.id}',this.value)">${Object.entries(ROLE).map(([k,v]) => `<option value="${k}" ${p.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`).join('')}</div>`;
}
const setRole = (id, r) => run(db.from('profiles').update({role:r}).eq('id', id), 'Роль изменена');

/* ---------- settings ---------- */
function settingsView(){
  return `<h1>Настройки</h1><p class="sub">Ваш профиль.</p><div class="card" style="max-width:460px"><form onsubmit="return saveName(event)">
    <label>Имя и фамилия</label><input name="n" value="${e(me.full_name)}" required><label>Роль</label><input value="${ROLE[me.role]}" disabled>
    <button class="btn" style="margin-top:18px">Сохранить изменения</button></form></div>
    <button class="btn ghost" onclick="db.auth.signOut()">Выйти</button>`;
}
async function saveName(ev){
  ev.preventDefault(); const n = new FormData(ev.target).get('n').trim();
  const {error} = await db.from('profiles').update({full_name:n}).eq('id', me.id); if (error) return toast(error.message) || false;
  me.full_name = n; $('#wName').textContent = n; P[me.id].full_name = n; toast('Изменения сохранены'); return false;
}

const VIEWS = {home:homeView, schedule:scheduleView, grades:gradesView, homework:homeworkView, students:studentsView, teachers:teachersView, users:usersView, settings:settingsView};
boot();
</script>
</body>
</html>
