<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LanLand</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#f5f6fa;
 --card:#fff;
 --line:#e5e7ee;
 --text:#171923;
 --muted:#737987;
 --blue:#4f5bd5;
 --blue2:#eef0ff;
 --red:#dc3545;
 --green:#16855b;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font:14px Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.muted{color:var(--muted)}
.danger{color:var(--red)}

.login{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
}
.loginbox{
 width:390px;
 max-width:100%;
 background:#fff;
 padding:32px;
 border:1px solid var(--line);
 border-radius:20px;
 box-shadow:0 10px 40px #0000000a;
}
.logo{
 font-size:25px;
 font-weight:800;
 margin-bottom:25px;
}

h1,h2,h3{margin:0 0 16px}
label{
 display:block;
 margin:12px 0 6px;
 font-weight:600;
}
input,select,textarea{
 width:100%;
 padding:11px 12px;
 border:1px solid var(--line);
 border-radius:10px;
 background:#fff;
 outline:0;
}
input:focus,select:focus,textarea:focus{
 border-color:var(--blue);
}
textarea{
 resize:vertical;
 min-height:90px;
}

.btn{
 padding:10px 15px;
 border-radius:10px;
 background:var(--blue);
 color:#fff;
 font-weight:600;
}
.btn.gray{
 background:#eee;
 color:#333;
}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn.sm{
 padding:7px 10px;
 font-size:12px;
}
.err{
 color:var(--red);
 margin-top:12px;
}

.app{
 display:flex;
 min-height:100vh;
}
.side{
 width:235px;
 background:#fff;
 border-right:1px solid var(--line);
 padding:22px 14px;
 position:fixed;
 inset:0 auto 0 0;
 overflow-y:auto;
}
.brand{
 font-size:22px;
 font-weight:800;
 padding:5px 10px 22px;
}
.nav{
 display:grid;
 gap:4px;
}
.nav button{
 background:none;
 text-align:left;
 padding:11px 12px;
 border-radius:10px;
 color:#4e5360;
}
.nav button.active,
.nav button:hover{
 background:var(--blue2);
 color:var(--blue);
 font-weight:600;
}

.main{
 margin-left:235px;
 width:calc(100% - 235px);
 padding:28px;
}
.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:22px;
 gap:15px;
}
.card{
 background:#fff;
 border:1px solid var(--line);
 border-radius:16px;
 padding:18px;
 margin-bottom:16px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
}
.stat{
 padding:18px;
 border:1px solid var(--line);
 border-radius:14px;
 background:#fff;
}
.stat b{
 font-size:26px;
 display:block;
 margin-top:7px;
}

table{
 width:100%;
 border-collapse:collapse;
}
th,td{
 text-align:left;
 padding:11px;
 border-bottom:1px solid var(--line);
 vertical-align:top;
}
.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}
.empty{
 padding:25px;
 text-align:center;
 color:var(--muted);
}

.week{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:8px;
}
.day{
 min-height:170px;
 background:#fff;
 border:1px solid var(--line);
 border-radius:12px;
 padding:10px;
}
.dayhead{
 font-weight:700;
 margin-bottom:9px;
}
.lesson{
 background:var(--blue2);
 padding:9px;
 border-radius:9px;
 margin-bottom:7px;
 font-size:12px;
}
.lesson b{
 display:block;
 margin-bottom:4px;
}

.modalbg{
 position:fixed;
 inset:0;
 background:#0008;
 display:grid;
 place-items:center;
 padding:15px;
 z-index:20;
}
.modal{
 background:#fff;
 width:600px;
 max-width:100%;
 max-height:90vh;
 overflow:auto;
 border-radius:17px;
 padding:22px;
}
.modalhead{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
}
.close{
 background:#eee;
 border-radius:8px;
 width:32px;
 height:32px;
 flex-shrink:0;
}
.formgrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.full{grid-column:1/-1}
.check{
 display:flex;
 gap:8px;
 align-items:center;
 padding:7px 0;
 font-weight:400;
}
.check input{width:auto}

.chat{
 display:grid;
 grid-template-columns:220px 1fr;
 gap:12px;
 height:65vh;
}
.people,.messages{
 background:#fff;
 border:1px solid var(--line);
 border-radius:14px;
}
.people{
 padding:8px;
 overflow:auto;
}
.person{
 padding:11px;
 border-radius:9px;
 cursor:pointer;
}
.person:hover,
.person.active{
 background:var(--blue2);
}
.messages{
 display:flex;
 flex-direction:column;
 overflow:hidden;
}
.msgs{
 flex:1;
 overflow:auto;
 padding:15px;
}
.msg{
 padding:9px 12px;
 background:#f0f1f6;
 border-radius:10px;
 margin-bottom:8px;
 max-width:75%;
}
.msg.mine{
 margin-left:auto;
 background:var(--blue2);
}
.send{
 padding:10px;
 border-top:1px solid var(--line);
 display:flex;
 gap:8px;
}
.send input{flex:1}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:999px;
 background:var(--blue2);
 color:var(--blue);
 font-size:12px;
 font-weight:600;
}
.badge.red{
 background:#ffe9ec;
 color:var(--red);
}
.badge.green{
 background:#e8f7f0;
 color:var(--green);
}

.errorbox{
 background:#fff0f1;
 border:1px solid #ffc7cd;
 color:#a51f2b;
 border-radius:12px;
 padding:15px;
 margin-bottom:15px;
}

@media(max-width:850px){
 .side{width:70px}
 .brand{font-size:0}
 .brand:after{
  content:"L";
  font-size:22px;
 }
 .nav button{
  font-size:0;
 }
 .nav button:before{
  content:"•";
  font-size:20px;
 }
 .main{
  margin-left:70px;
  width:calc(100% - 70px);
  padding:15px;
 }
 .grid{grid-template-columns:1fr 1fr}
 .week{grid-template-columns:1fr}
 .chat{grid-template-columns:1fr;height:auto}
 .people{max-height:220px}
 .messages{height:500px}
 table{
  display:block;
  overflow-x:auto;
 }
}
</style>
</head>

<body>

<div id="login" class="login">
 <div class="loginbox">

  <div class="logo">LanLand</div>

  <label>Email</label>
  <input id="email" type="email" autocomplete="username">

  <label>Пароль</label>
  <input id="pass" type="password" autocomplete="current-password">

  <button
   class="btn"
   style="width:100%;margin-top:16px"

   Войти
  </button>

  <div id="loginErr" class="err"></div>

 </div>
</div>


<div id="app" class="app hidden">

 <aside class="side">

  <div class="brand">LanLand</div>

  <div id="nav" class="nav"></div>

 </aside>


 <main class="main">

  <div class="top">

   <div>
    <h2 id="title"></h2>
    <span id="subtitle" class="muted"></span>
   </div>

   <button
    class="btn gray"
    onclick="logout()">
    Выйти
   </button>

  </div>

  <div id="content"></div>

 </main>

</div>


<div id="modal" class="hidden"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
 'https://opwzlempjchopqdyggrk.supabase.co';

const SUPABASE_ANON_KEY =
 'sb_publishable_-hmiHifgWmpjKA-9l3cZhg_FHWZLI6_';

const ADMIN_FUNCTION =
 'admin-user';

const sb =
 supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
 );


/* =========================================================
   LANGUAGES
========================================================= */

const LANG = [
 'Английский',
 '中文',
 'Français',
 'Deutsch'
];


/* =========================================================
   GRADE WEIGHTS
========================================================= */

const WT = {
 'КР':1.5,
 'Проверочная':1.15,
 'Тест':1,
 'ДЗ':0.8,
 'Р/У':0.7
};


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let page = 'schedule';

let profiles = [];
let scheduleRows = [];
let homeworkRows = [];
let submissionRows = [];
let gradeRows = [];
let messageRows = [];

let week = 0;

let chatUser = null;

let checkHw = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
 document.getElementById(id);


const esc = x =>
 String(x ?? '').replace(
  /[&<>"']/g,
  m => ({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[m])
 );


function profile(id){

 return profiles.find(
  x => String(x.id) === String(id)
 );

}


function teachers(){

 return profiles.filter(
  x => x.role === 'teacher'
 );

}


function students(){

 return profiles.filter(
  x => x.role === 'student'
 );

}


function roleName(r){

 if(r === 'admin')
  return 'Администратор';

 if(r === 'teacher')
  return 'Преподаватель';

 return 'Ученик';

}


/* =========================================================
   LANGUAGE HELPERS
========================================================= */

function langs(x){

 if(!x)
  return [];

 if(Array.isArray(x))
  return x;

 if(typeof x === 'string'){

  try{

   const a = JSON.parse(x);

   if(Array.isArray(a))
    return a;

   return [x];

  }catch(e){

   return x
    .split(',')
    .map(v => v.trim())
    .filter(Boolean);

  }

 }

 return [];

}


function ids(x){

 if(!x)
  return [];

 if(Array.isArray(x))
  return x.map(String);

 if(typeof x === 'string'){

  try{

   const a = JSON.parse(x);

   return Array.isArray(a)
    ? a.map(String)
    : [];

  }catch(e){

   return x
    .split(',')
    .map(v => v.trim())
    .filter(Boolean)
    .map(String);

  }

 }

 return [];

}


const langsForTeacher =
 t => langs(t?.languages);


const langsForStudent =
 s => langs(s?.languages);


function studentsOf(t){

 if(!t)
  return [];

 return students().filter(
  s =>
   String(s.teacher_id) ===
   String(t.id)
 );

}


/* =========================================================
   PROFILE MERGE
========================================================= */

function mergeProfiles(a = []){

 const m = new Map(
  profiles.map(
   x => [String(x.id), x]
  )
 );

 a.forEach(
  x => m.set(String(x.id),x)
 );

 profiles = [...m.values()];

}


/* =========================================================
   STUDENTS OF TEACHER
========================================================= */

async function dbStudents(t){

 if(!t?.id)
  return [];

 const local =
  profiles.filter(
   s =>
    s.role === 'student' &&
    String(s.teacher_id) ===
    String(t.id)
  );

 if(local.length)
  return local;

 const {
  data,
  error
 } = await sb
  .from('profiles')
  .select('*')
  .eq('role','student')
  .eq('teacher_id',t.id)
  .order('full_name');

 if(error){

  console.error(
   'STUDENTS:',
   error
  );

  return [];

 }

 mergeProfiles(data || []);

 return data || [];

}


/* =========================================================
   MODALS
========================================================= */

function open(html){

 $('modal').innerHTML = `
  <div class="modalbg" onclick="modalBackgroundClick(event)">
   <div class="modal" onclick="event.stopPropagation()">
    ${html}
   </div>
  </div>
 `;

 $('modal').classList.remove('hidden');

}


function closeModal(){

 $('modal').innerHTML = '';

 $('modal').classList.add('hidden');

}


function modalBackgroundClick(e){

 if(e.target.classList.contains('modalbg'))
  closeModal();

}


/* =========================================================
   AUTH
========================================================= */

async function init(){

 try{

  const {
   data:{session}
  } = await sb.auth.getSession();

  if(session){

   await afterLogin(
    session.user
   );

  }

 }catch(error){

  console.error(
   'INIT ERROR:',
   error
  );

 }

}


async function login(){

 $('loginErr').textContent = '';

 const email =
  $('email').value.trim();

 const password =
  $('pass').value;

 if(!email || !password){

  $('loginErr').textContent =
   'Введите email и пароль.';

  return;

 }

 const {
  data,
  error
 } =
  await sb.auth.signInWithPassword({
   email,
   password
  });

 if(error){

  $('loginErr').textContent =
   error.message;

  return;

 }

 await afterLogin(data.user);

}


async function afterLogin(u){

 const {
  data,
  error
 } =
  await sb
   .from('profiles')
   .select('*')
   .eq('id',u.id)
   .single();

 if(error || !data){

  console.error(
   'PROFILE ERROR:',
   error
  );

  alert(
   'Профиль пользователя не найден. Проверь таблицу profiles и RLS.'
  );

  return;

 }

 currentUser = data;

 await reloadData();

 $('login').classList.add('hidden');

 $('app').classList.remove('hidden');

 renderNav();

 await render();

}


async function logout(){

 await sb.auth.signOut();

 location.reload();

}


/* =========================================================
   DATA
========================================================= */

async function reloadData(){

 const q =
  await Promise.all([

   sb
    .from('profiles')
    .select('*'),

   sb
    .from('schedule')
    .select('*')
    .order('lesson_date')
    .order('start_time'),

   sb
    .from('homework')
    .select('*')
    .order(
     'created_at',
     {ascending:false}
    ),

   sb
    .from('submissions')
    .select('*')
    .order(
     'created_at',
     {ascending:false}
    ),

   sb
    .from('grades')
    .select('*')
    .order(
     'created_at',
     {ascending:false}
    )

  ]);


 const errors = [];


 if(q[0].error){

  console.error(
   'PROFILES:',
   q[0].error
  );

  errors.push(
   'profiles: '+
   q[0].error.message
  );

  profiles = [];

 }else{

  profiles = q[0].data || [];

 }


 if(q[1].error){

  console.error(
   'SCHEDULE:',
   q[1].error
  );

  errors.push(
   'schedule: '+
   q[1].error.message
  );

  scheduleRows = [];

 }else{

  scheduleRows =
   q[1].data || [];

 }


 if(q[2].error){

  console.error(
   'HOMEWORK:',
   q[2].error
  );

  errors.push(
   'homework: '+
   q[2].error.message
  );

  homeworkRows = [];

 }else{

  homeworkRows =
   q[2].data || [];

 }


 if(q[3].error){

  console.error(
   'SUBMISSIONS:',
   q[3].error
  );

  errors.push(
   'submissions: '+
   q[3].error.message
  );

  submissionRows = [];

 }else{

  submissionRows =
   q[3].data || [];

 }


 if(q[4].error){

  console.error(
   'GRADES:',
   q[4].error
  );

  errors.push(
   'grades: '+
   q[4].error.message
  );

  gradeRows = [];

 }else{

  gradeRows =
   q[4].data || [];

 }


 const {
  data:messages,
  error:messagesError
 } =
  await sb
   .from('messages')
   .select('*')
   .order('created_at');


 if(messagesError){

  console.error(
   'MESSAGES:',
   messagesError
  );

  errors.push(
   'messages: '+
   messagesError.message
  );

  messageRows = [];

 }else{

  messageRows =
   messages || [];

 }


 if(errors.length){

  console.warn(
   'Ошибки загрузки данных:',
   errors
  );

 }

}


/* =========================================================
   NAVIGATION
========================================================= */

function navItems(){

 let n = [
  ['schedule','Расписание'],
  ['homework','Домашняя работа'],
  ['grades','Оценки'],
  ['chat','Чат']
 ];


 if(currentUser.role === 'admin'){

  n.push(
   ['students','Ученики'],
   ['users','Пользователи'],
   ['analytics','Аналитика'],
   ['settings','Настройки']
  );

 }


 if(currentUser.role === 'teacher'){

  n.push(
   ['students','Ученики'],
   ['check','Проверка']
  );

 }


 return n;

}


function renderNav(){

 $('nav').innerHTML =
  navItems()
   .map(x => `
    <button
     class="${page === x[0] ? 'active' : ''}"
     onclick="go('${x[0]}')">
     ${x[1]}
    </button>
   `)
   .join('');

}


async function go(p){

 const allowed =
  navItems().some(
   x => x[0] === p
  );

 if(!allowed){

  page = 'schedule';

 }else{

  page = p;

 }

 renderNav();

 await render();

}


/* =========================================================
   MAIN RENDER
========================================================= */

async function render(){

 const names = {

  schedule:'Расписание',
  homework:'Домашняя работа',
  grades:'Оценки',
  chat:'Чат',
  students:'Ученики',
  users:'Пользователи',
  analytics:'Аналитика',
  settings:'Настройки',
  check:'Проверка'

 };


 $('title').textContent =
  names[page] || 'LanLand';


 $('subtitle').textContent =
  currentUser.full_name +
  ' · ' +
  roleName(currentUser.role);


 $('content').innerHTML =
  '<div class="empty">Загрузка...</div>';


 try{

  switch(page){

   case 'schedule':
    await renderSchedule();
    break;

   case 'homework':
    await renderHomework();
    break;

   case 'grades':
    await renderGrades();
    break;

   case 'chat':
    await renderChat();
    break;

   case 'students':
    await renderStudents();
    break;

   case 'users':
    await renderUsers();
    break;

   case 'analytics':
    await renderAnalytics();
    break;

   case 'settings':
    await renderSettings();
    break;

   case 'check':
    await renderCheck();
    break;

   default:

    $('content').innerHTML =
     '<div class="empty">Раздел не найден.</div>';

  }

 }catch(error){

  console.error(
   'RENDER ERROR:',
   error
  );

  $('content').innerHTML = `

   <div class="errorbox">

    <h3>Ошибка загрузки раздела</h3>

    <p>
     ${esc(
      error?.message ||
      String(error)
     )}
    </p>

    <button
     class="btn"
     onclick="render()">
     Повторить
    </button>

   </div>

  `;

 }

}


/* =========================================================
   DATE
========================================================= */

function startOfWeek(d = new Date()){

 d = new Date(d);

 let x =
  d.getDay() || 7;

 d.setDate(
  d.getDate() -
  x +
  1 +
  week * 7
 );

 d.setHours(
  0,0,0,0
 );

 return d;

}


function iso(d){

 const x =
  d instanceof Date
   ? d
   : new Date(
      String(d) +
      'T00:00:00'
     );

 return (
  `${x.getFullYear()}-`+
  `${String(
    x.getMonth()+1
   ).padStart(2,'0')}-`+
  `${String(
    x.getDate()
   ).padStart(2,'0')}`
 );

}


function fmt(d){

 const x =
  d instanceof Date
   ? d
   : new Date(
      String(d) +
      'T00:00:00'
     );

 return x.toLocaleDateString(
  'ru-RU',
  {
   day:'2-digit',
   month:'2-digit'
  }
 );

}


/* =========================================================
   SCHEDULE
========================================================= */

function visibleSchedule(){

 return scheduleRows.filter(x => {

  if(currentUser.role === 'admin')
   return true;

  if(currentUser.role === 'teacher'){

   return String(x.teacher_id) ===
          String(currentUser.id);

  }

  return String(x.student_id) ===
         String(currentUser.id);

 });

}


async function renderSchedule(){

 const d =
  startOfWeek();


 const days =
  Array.from(
   {length:7},
   (_,i) => {

    let x =
     new Date(d);

    x.setDate(
     d.getDate()+i
    );

    return x;

   }
  );


 const add =
  currentUser.role !== 'student'
   ? `
    <button
     class="btn"
     onclick="scheduleModal()">
     Добавить занятие
    </button>
   `
   : '';


 $('content').innerHTML = `

  <div class="card">

   <div class="actions">

    ${add}

    <button
     class="btn gray"
     onclick="week--;render()">
     ←
    </button>

    <button
     class="btn gray"
     onclick="week=0;render()">
     Сегодня
    </button>

    <button
     class="btn gray"
     onclick="week++;render()">
     →
    </button>

   </div>

  </div>


  <div class="week">

   ${
    days.map(day => {

     const rows =
      visibleSchedule()
       .filter(
        x =>
         String(x.lesson_date) ===
         String(iso(day))
       )
       .sort(
        (a,b) =>
         String(a.start_time || '')
          .localeCompare(
           String(b.start_time || '')
          )
       );


     return `

      <div class="day">

       <div class="dayhead">

        ${day.toLocaleDateString(
         'ru-RU',
         {weekday:'short'}
        )}

        ${fmt(day)}

       </div>


       ${
        rows.length
         ? rows.map(x => {

          const t =
           profile(x.teacher_id);

          const s =
           profile(x.student_id);


          const can =
           currentUser.role === 'admin' ||
           (

async function saveSchedule(id){

 const teacherId =
  $('st')?.value;

 const studentId =
  $('su')?.value;

 const language =
  $('sl')?.value;

 const lessonDate =
  $('sd')?.value || '';

 const startTime =
  $('ss')?.value || '';

 const endTime =
  $('se')?.value || '';


 if(
  !lessonDate ||
  !startTime ||
  !endTime
 ){

  alert(
   'Укажите дату и время.'
  );

  return;

 }


 if(startTime >= endTime){

  alert(
   'Время окончания должно быть позже времени начала.'
  );

  return;

 }


 const t =
  profile(teacherId);

 const s =
  profile(studentId);


 if(!t || !s || !language){

  alert(
   'Выберите преподавателя, язык и ученика.'
  );

  return;

 }


 if(
  currentUser.role === 'teacher' &&
  String(t.id) !==
  String(currentUser.id)
 ){

  alert(
   'Можно создавать только свои занятия.'
  );

  return;

 }


 if(
  !langsForTeacher(t)
   .includes(language)
 ){

  alert(
   'Этот язык не назначен преподавателю.'
  );

  return;

 }


 if(
  !langsForStudent(s)
   .includes(language)
 ){

  alert(
   'Этот язык не назначен ученику.'
  );

  return;

 }


 if(
  String(s.teacher_id) !==
  String(t.id)
 ){

  alert(
   'Этот ученик не привязан к выбранному преподавателю.'
  );

  return;

 }


 const p = {

  lesson_date:
   lessonDate,

  start_time:
   startTime,

  end_time:
   endTime,

  language,

  teacher_id:
   t.id,

  student_id:
   s.id

 };


 const r =
  id
   ? await sb
      .from('schedule')
      .update(p)
      .eq('id',id)

   : await sb
      .from('schedule')
      .insert(p);


 if(r.error){

  alert(
   r.error.message
  );

  return;

 }


 closeModal();

 await reloadData();

 await render();

}

function decodeSubmission(s){

 if(!s)
  return {
   answer:'',
   link:''
  };


 const raw =
  String(s.comment || '');


 const prefix =
  'LANLAND_SUBMISSION_V1|';


 if(raw.startsWith(prefix)){

  try{

   return {
    answer:'',
    link:'',
    ...JSON.parse(
     raw.slice(prefix.length)
    )
   };

  }catch(e){}

 }


 return {
  answer:raw,
  link:''
 };

}


function encodeSubmission(
 answer,
 link
){

 return (
  'LANLAND_SUBMISSION_V1|' +
  JSON.stringify({
   answer:
    String(answer || ''),
   link:
    String(link || '')
  })
 );

}


function fileUrl(path){

 if(!path)
  return '';

 if(
  /^https?:\/\//i.test(path)
 )
  return path;


 return sb.storage
  .from('homework-files')
  .getPublicUrl(path)
  .data
  .publicUrl;

}

async function submitHomework(id){

 if(currentUser.role !== 'student')
  return;


 const answer =
  $('answer').value.trim();


 const link =
  $('answerlink').value.trim();


 const file =
  $('answerfile')?.files?.[0] ||
  null;


 const old =
  submissionFor(
   id,
   currentUser.id
  );


 if(
  !answer &&
  !link &&
  !file
 ){

  alert(
   'Добавьте ответ, ссылку или файл.'
  );

  return;

 }


 let filePath =
  old?.file_path ||
  null;


 if(file){

  const safe =
   file.name.replace(
    /[^a-zA-Z0-9._-]/g,
    '_'
   );


  const path =
   `${currentUser.id}/${id}/${Date.now()}_${safe}`;


  const up =
   await sb.storage
    .from('homework-files')
    .upload(
     path,
     file,
     {
      upsert:true,
      contentType:
       file.type ||
       'application/octet-stream'
     }
    );


  if(up.error){

   alert(
    'Ошибка загрузки файла: '+
    up.error.message
   );

   return;

  }


  filePath =
   up.data.path;

 }


 const p = {

  homework_id:
   id,

 });

function weightedAverage(rows){

 const a =
  rows.filter(
   x => x.grade != null
  );


 let s = 0;

 let w = 0;


 a.forEach(x => {

  const z =
   WT[x.type] || 1;

  s +=
   Number(x.grade) * z;

  w += z;

 });


 return w
  ? (s / w).toFixed(2)
  : '—';

}

async function saveGrade(){

  currentUser.role !== 'admin' &&
  currentUser.role !== 'teacher'
 )
  return;


 const s =
  profile(
   $('gs').value
  );


 const t =
  profile(
   $('gt').value
  );


 const language =
  $('gl').value;


 if(
  !s ||
  !t
 ){

  alert(
   'Ученик или преподаватель не найден.'
  );

  return;

 }


 if(
  currentUser.role === 'teacher' &&
  String(t.id) !==
  String(currentUser.id)
 ){

  alert(
   'Можно выставлять оценки только своим ученикам.'

  !langsForTeacher(t)
   .includes(language)
 ){

  );

  !langsForStudent(s)
   .includes(language)
 ){

  );

  String(s.teacher_id) !==
  String(t.id)
 ){

  Number(
   $('gv').value

  value < 1 ||
  value > 5
 ){

  alert(
   'Введите целую оценку от 1 до 5.'

 const type =
  $('gtype').value;


 const p = {

  student_id:

  language,

  type,

  grade:

  what:

   .insert(p);


 if(r.error){

async function saveUser(id){

 if(currentUser.role !== 'admin')
  return;


 const role =
  $('ur').value;


 const name =
  $('uname').value.trim();


 const languages = [
  ...document.querySelectorAll(
   '.ulang:checked'
  )
 ].map(
  x => x.value
 );


 const teacherId =
  role === 'student'
   ? ($('ut')?.value || null)
   : null;


 if(!name){

  alert(
   'Введите имя.'
  );

  return;

 }


 if(
  role === 'teacher' ||
  role === 'student'
 ){

  if(!languages.length){

   alert(
    'Выберите хотя бы один язык.'
   );

   return;

  }

 }


 if(
  role === 'student' &&
  !teacherId
 ){

  alert(
   'Назначьте преподавателя ученику.'
  );

  return;

 }


 if(id){

  const p = {

   full_name:
    name,

   role,

   languages,

   teacher_id:
    role === 'student'
     ? teacherId
     : null

  };


  const r =
   await sb
    .from('profiles')
    .update(p)
    .eq('id',id);


  if(r.error){

   alert(
    r.error.message
   );

   return;

  }


 }else{

  const email =
   $('ul').value.trim();


  const password =
   $('up').value;


  if(
   !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(email)
  ){

   alert(
    'Введите корректный email.'
   );

   return;

  }


  if(password.length < 6){

   alert(
    'Пароль должен содержать минимум 6 символов.'
   );

   return;

  }


  const {
   data:{session}
  } =
   await sb.auth.getSession();


  if(!session){

   alert(
    'Сессия истекла.'
   );

   return;

  }


  const r =
   await fetch(
    SUPABASE_URL +
    '/functions/v1/' +
    ADMIN_FUNCTION,
    {
     method:'POST',

     headers:{
      'Content-Type':
       'application/json',

      'Authorization':
       'Bearer ' +
       session.access_token
     },

     body:
      JSON.stringify({
       action:'create',
       email,
       password,
       full_name:name,
       role,
       languages,
       teacher_id:teacherId
      })
    }
   );


  let j = {};

  try{

   j = await r.json();

  }catch(e){}


  if(!r.ok){

   alert(
    j.error ||
    j.message ||
    'Ошибка создания пользователя.'
   );

   return;

  }

 }


 closeModal();

 await reloadData();

 await render();

}

   .from('messages')
   .select('*')
   .or(

   .from('messages')
   .insert({
    sender_id:
     currentUser.id,

    user_a:
     userA,

    user_b:
     userB,

    body
   });


 if(r.error){

  alert(
   r.error.message
  );

  return;

 }


 $('msg').value = '';

 await loadChatMessages();

}


/* =========================================================
   CHECK HOMEWORK
========================================================= */

async function openCheckList(id){

 if(
  currentUser.role !== 'teacher' &&
  currentUser.role !== 'admin'
 )
  return;


 const h =
  homeworkRows.find(
   x =>
    String(x.id) ===
    String(id)
  );


 if(!h){

  alert(
   'ДЗ не найдено.'
  );

  return;

 }


 if(
  currentUser.role === 'teacher' &&
  String(h.teacher_id) !==
  String(currentUser.id)
 ){

  alert(
   'Можно проверять только ДЗ своих учеников.'
  );

  return;

 }


 checkHw = id;

 page = 'check';

 renderNav();

async function renderCheck(){

 if(
  currentUser.role !== 'teacher' &&
  currentUser.role !== 'admin'
 ){

  $('content').innerHTML =
   '<div class="empty">Нет доступа.</div>';

  return;

 }


 const h =
  homeworkRows.find(
   x =>
    String(x.id) ===
    String(checkHw)
  );


 if(!h){

  $('content').innerHTML = `

   <div class="empty">
    Выберите ДЗ для проверки.
   </div>

  `;

  return;

 }


 const s =
  profile(h.student_id);


 const sub =
  s
   ? submissionFor(
      h.id,
      s.id
     )
   : null;


 const d =
  decodeSubmission(sub);


 $('title').textContent =
  'Проверка';


 $('content').innerHTML = `

  <div class="card">

   <h3>
    ${esc(h.title)}
   </h3>

   <p class="muted">
    ${esc(h.language)}
   </p>


   ${
    s

     ? `

      <div class="card">

       <b>
        ${esc(s.full_name)}
       </b>


       <p>
        ${
         d.answer
          ? esc(d.answer)
          : '<span class="muted">Ответ не отправлен</span>'
        }
       </p>


       ${
        d.link
         ? `

          <p>
           <a
            href="${esc(d.link)}"
            target="_blank"
            rel="noopener">
            Открыть ссылку ученика
           </a>
          </p>

         `
         : ''
       }


       ${
        sub?.file_path
         ? `

          <p>
           <a
            href="${esc(
             fileUrl(
              sub.file_path
             )
            )}"
            target="_blank"
            rel="noopener">
            Открыть прикреплённый файл
           </a>
          </p>

         `
         : ''
       }


       ${
        sub?.status === 'checked'
         ? `

          <p>

           <span class="badge green">
            Проверено: ${
             esc(
              sub.grade ?? '—'
             )
            } / 5
           </span>

          </p>

         `
         : `

          <p>

           <span class="badge">
            ${
             sub
              ? 'Сдано'
              : 'Не сдано'
            }
           </span>

          </p>

         `
       }


       <button
        class="btn sm"
        style="margin-top:8px"
        onclick="openCheck('${h.id}','${s.id}')">
        Проверить
       </button>

      </div>

     `

     : `

      <div class="empty">
       Ученик не найден.
      </div>

     `
   }

  </div>

 `;

}


function openCheck(hid,sid){

 if(
  currentUser.role !== 'teacher' &&
  currentUser.role !== 'admin'
 )
  return;


 const h =
  homeworkRows.find(
   x =>
    String(x.id) ===
    String(hid)
  );


 if(
  currentUser.role === 'teacher' &&
  String(h?.teacher_id) !==
  String(currentUser.id)
 ){

  alert(
   'Нет доступа.'
  );

  return;

 }


 const sub =
  submissionFor(
   hid,
   sid
  );


 const g =
  gradeRows.find(
   x =>
    String(x.homework_id) ===
    String(hid)
    &&
    String(x.student_id) ===
    String(sid)
  );


 const d =
  decodeSubmission(sub);


 open(`

  <div class="modalhead">

   <h3>
    Проверка
   </h3>

   <button
    class="close"
    onclick="closeModal()">
    ×
   </button>

  </div>


  <p>

   <b>
    Ответ ученика:
   </b>

  </p>


  <div
   class="card"
   style="background:#f7f7fa">

   ${
    d.answer
     ? esc(d.answer)
     : '<span class="muted">Нет текстового ответа</span>'
   }

  </div>


  ${
   d.link
    ? `

     <p>
      <a
       href="${esc(d.link)}"
       target="_blank"
       rel="noopener">
       Открыть ссылку ученика
      </a>
     </p>

    `
    : ''
  }


  ${
   sub?.file_path
    ? `

     <p>
      <a
       href="${esc(
        fileUrl(
         sub.file_path
        )
       )}"
       target="_blank"
       rel="noopener">
       Открыть прикреплённый файл
      </a>
     </p>

    `
    : ''
  }


  <label>
   Оценка
  </label>

  <input
   id="cv"
   type="number"
   min="1"
   max="5"
   step="1"
   value="${g?.grade || ''}">


  <label>
   Комментарий
  </label>

  <textarea
   id="cc">${esc(
    g?.comment || ''
   )}</textarea>


  <div
   class="actions"
   style="margin-top:15px">

   <button
    class="btn"
    onclick="finishCheck(
     '${hid}',
     '${sid}',
     '${g?.id || ''}'
    )">
    Сохранить
   </button>

   <button
    class="btn gray"
    onclick="closeModal()">
    Отмена
   </button>

  </div>

 `);

}


async function finishCheck(
 hid,
 sid,
 gid
){

 if(
  currentUser.role !== 'teacher' &&
  currentUser.role !== 'admin'
 )
  return;


 const h =
  homeworkRows.find(
   x =>
    String(x.id) ===
    String(hid)
  );


 if(!h){

  alert(
   'ДЗ не найдено.'
  );

  return;

 }


 if(
  currentUser.role === 'teacher' &&
  String(h.teacher_id) !==
  String(currentUser.id)
 ){

  alert(
   'Нет доступа.'
  );

  return;

 }


 const value =
  Number(
   $('cv').value
  );


 if(
  !Number.isInteger(value) ||
  value < 1 ||
  value > 5
 ){

  alert(
   'Введите оценку от 1 до 5.'
  );

  return;

 }


 const comment =
  $('cc').value.trim();


 const p = {

  homework_id:
   hid,

  student_id:
   sid,

  teacher_id:
   h.teacher_id,

  language:
   h.language,

  type:
   'ДЗ',

  grade:
   value,

  what:
   h.title,

  comment:
   comment || null

 };


 const r =
  gid

   ? await sb
      .from('grades')
      .update(p)
      .eq('id',gid)

   : await sb
      .from('grades')
      .insert(p);


 if(r.error){

  alert(
   r.error.message
  );

  return;

 }


 const submissionUpdate =
  await sb
   .from('submissions')
   .update({

    grade:
     value,

    status:
     'checked',

    teacher_comment:
     comment || null,

    checked_at:
     new Date().toISOString()

   })
   .eq(
    'homework_id',
    hid
   )
   .eq(
    'student_id',
    sid
   );


 if(submissionUpdate.error){

  console.warn(
   'SUBMISSION CHECK UPDATE:',
   submissionUpdate.error
  );

 }


 closeModal();

 await reloadData();

 await renderCheck();

}
