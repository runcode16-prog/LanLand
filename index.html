<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LanLand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F3F5F7;--ink:#111827;--mute:#6B7280;--line:#E5E7EB;--card:#fff;--pri:#111827;--pri2:#111827;--lime:#D3F54A;--en:#3B6BFF;--zh:#FF5A4F;--fr:#16B38A;--de:#FFA620;--r:24px}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 Onest,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:Unbounded,Onest,sans-serif;font-weight:600;letter-spacing:-.03em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #9CA3AF;outline-offset:2px}
.hide{display:none!important}
#auth{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr}
.hero{padding:48px 6vw;display:flex;flex-direction:column;justify-content:space-between;background:#E9EEF3;border-radius:0 40px 40px 0}
.logo{font-size:22px;display:flex;align-items:center;gap:10px}
.mark{display:grid;grid-template-columns:repeat(2,11px);gap:3px}
.mark i{width:11px;height:11px;border-radius:4px}
.mark i:nth-child(1){background:var(--en)}.mark i:nth-child(2){background:var(--zh)}.mark i:nth-child(3){background:var(--fr)}.mark i:nth-child(4){background:var(--de)}
#greet{font-family:Unbounded,sans-serif;font-weight:600;font-size:clamp(52px,9vw,128px);line-height:1;letter-spacing:-.04em;transition:opacity .35s,transform .35s}
#greet.out{opacity:0;transform:translateY(14px)}
.cap{color:var(--mute);margin-top:14px;font-weight:500}
.tag{max-width:30ch;color:var(--mute);font-size:17px}
.formside{display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:100%;max-width:380px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--pri2)}
.btn{border:0;background:var(--pri);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{box-shadow:0 8px 20px rgba(17,24,39,.3);transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.full{width:100%;margin-top:22px;padding:14px}
.btn.ghost{background:#EEF0F3;color:var(--pri)}.btn.ghost:hover{box-shadow:none;background:#E3E6EA}
.btn.lime{background:var(--lime);color:var(--ink)}.btn.lime:hover{box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn.del{background:none;color:var(--zh);padding:6px 10px}.btn.del:hover{box-shadow:none;background:#FFEBE9;transform:none}
.msg{margin-top:14px;font-size:14px;color:var(--zh);min-height:20px}.msg.ok{color:var(--fr)}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:#fff;padding:26px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;border-radius:0 32px 32px 0;box-shadow:0 0 40px -20px rgba(17,24,39,.3)}
nav{display:flex;flex-direction:column;gap:3px}
nav button{text-align:left;border:0;background:none;padding:11px 16px;border-radius:14px;cursor:pointer;font-weight:600;color:var(--mute);transition:.15s}
nav button:hover{background:#F3F5F7;color:var(--ink)}
nav button.on{background:var(--pri);color:#fff;box-shadow:0 8px 18px -8px rgba(17,24,39,.7)}
.who{margin-top:auto;padding:14px;border-radius:18px;background:#F3F5F7;font-size:13px}
.who b{display:block;font-size:14px}.who span{color:var(--mute)}
main{padding:36px clamp(18px,4vw,48px);max-width:1040px;width:100%}
main>h1{font-size:30px;margin-bottom:6px}.sub{color:var(--mute);margin-bottom:26px}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 12px 32px -18px rgba(17,24,39,.3);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:8px}
.grid .card{margin:0}
.big{font-family:Unbounded,sans-serif;font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1.1;color:var(--pri)}
.lbl{color:var(--mute);font-size:13px;font-weight:600}
h3{font-size:16px;margin-bottom:12px}
.banner{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#111827,#27303F);border-radius:28px;padding:30px 34px;margin-bottom:18px}
.banner::after{content:'Aa 文 Fr De';position:absolute;right:22px;bottom:-12px;font:600 76px Unbounded,sans-serif;opacity:.15;white-space:nowrap;pointer-events:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.dot.en,.c-en{background:var(--en)}.dot.zh,.c-zh{background:var(--zh)}.dot.fr,.c-fr{background:var(--fr)}.dot.de,.c-de{background:var(--de)}
.t-en{--x:var(--en)}.t-zh{--x:var(--zh)}.t-fr{--x:var(--fr)}.t-de{--x:var(--de)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}.row small{color:var(--mute);display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:#F3F5F7;font-weight:700;font-size:14px;white-space:nowrap}
.pill.kr{background:var(--lime)}
.day{font-family:Unbounded,sans-serif;font-size:15px;margin:22px 0 12px;text-transform:capitalize}
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.week{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
.dayb{flex:1;min-width:62px;border:0;background:#fff;border-radius:20px;padding:12px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 8px 20px -14px rgba(17,24,39,.4);transition:.15s}
.dayb small{color:var(--mute);font-weight:600}.dayb b{font:600 20px Unbounded,sans-serif}
.dayb:hover{transform:translateY(-2px)}
.dayb.today b{color:var(--pri)}
.dayb.on{background:var(--pri);color:#fff}.dayb.on small,.dayb.on b{color:#fff}
.dots{height:7px;display:flex;gap:3px;margin-top:3px}.dots i{width:7px;height:7px;border-radius:50%}
.lchain{border-radius:22px;overflow:hidden;margin-bottom:12px;box-shadow:0 12px 28px -18px rgba(17,24,39,.4)}
.lcard{--x:#6B7280;display:flex;align-items:center;gap:18px;padding:16px 20px;background:color-mix(in srgb,var(--x) 13%,#fff);border-left:7px solid var(--x)}
.lcard+.lcard{border-top:2px solid #fff}
.lt{display:flex;flex-direction:column;width:64px;font-variant-numeric:tabular-nums}
.lt b{font:600 17px Unbounded,sans-serif}.lt span,.lt small{color:var(--mute);font-weight:600;font-size:13px}
.lb{flex:1;min-width:0}.lb b{font-size:17px}.lb small{display:block;color:var(--mute)}
.empty{color:var(--mute);padding:18px 0}
details.card summary{cursor:pointer;font-weight:700;color:var(--pri);list-style:none}
details.card[open] summary{margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.chk label{display:flex;align-items:center;gap:7px;margin:0;color:var(--ink);font-size:14px}
.chk input{width:auto}
.seg{display:inline-flex;background:#fff;padding:5px;border-radius:18px;margin-bottom:18px;box-shadow:0 8px 20px -14px rgba(17,24,39,.4)}
.seg button{border:0;background:none;padding:10px 24px;border-radius:14px;font-weight:700;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.langpick{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.lp{position:relative;margin:0!important}.lp input{position:absolute;opacity:0;width:1px}
.lp span{display:inline-flex;align-items:center;padding:10px 16px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:700;color:var(--ink);cursor:pointer;transition:.15s}
.lp input:checked+span{border-color:var(--x,var(--pri));background:color-mix(in srgb,var(--x,var(--pri)) 14%,#fff)}
.lp input:focus-visible+span{outline:3px solid #9CA3AF}
.cred{background:var(--lime);border-radius:var(--r);padding:20px 24px;margin-bottom:18px;max-width:640px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:9;transition:opacity .25s;max-width:90vw}
@media(max-width:820px){
#auth{grid-template-columns:1fr}.hero{padding:28px 24px;gap:36px;border-radius:0 0 32px 32px}
#app{grid-template-columns:1fr}
aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:5;border-radius:22px 22px 0 0}
aside .logo,.who{display:none}
nav{flex-direction:row;overflow-x:auto;width:100%}nav button{white-space:nowrap;padding:10px 12px;font-size:13px}
main{padding:24px 16px 96px}.two{grid-template-columns:1fr}.banner{padding:24px}.banner::after{font-size:48px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v2 design ===== */
body{background-color:#EEF1F7;background-image:radial-gradient(900px 520px at 4% -8%,#D9E5FF 0,transparent 60%),radial-gradient(700px 480px at 100% 4%,#FFE3DE 0,transparent 55%),radial-gradient(800px 600px at 55% 112%,#DDF6EA 0,transparent 60%);background-attachment:fixed}
aside{background:rgba(255,255,255,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
nav button{display:flex;align-items:center;gap:12px}
nav button:hover{transform:translateX(3px)}
.ic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#F0F2F6;font-size:16px;flex:none;transition:.25s}
nav button.on .ic{background:rgba(255,255,255,.18);transform:rotate(-6deg) scale(1.1)}
.nb{margin-left:auto;background:var(--zh);color:#fff;border-radius:99px;font:700 11px Onest,sans-serif;padding:2px 8px;min-width:20px;text-align:center;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
main>*{animation:up .55s cubic-bezier(.2,.8,.2,1) backwards}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(n+5){animation-delay:.2s}
main>h1{background:linear-gradient(100deg,#111827 30%,#3B6BFF);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.card{border:1px solid rgba(255,255,255,.9);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 22px 40px -22px rgba(17,24,39,.4)}
.banner{background:linear-gradient(120deg,#0F172A,#1E2A5A,#3B1D5C,#0F172A);background-size:300% 300%;animation:up .55s backwards,flow 14s ease infinite;box-shadow:0 30px 60px -30px rgba(59,107,255,.6)}
.banner::before{content:'';position:absolute;width:320px;height:320px;right:-60px;top:-120px;background:radial-gradient(circle,rgba(211,245,74,.35),transparent 65%);animation:float 7s ease-in-out infinite;pointer-events:none}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes float{50%{transform:translate(-30px,30px) scale(1.15)}}
.big{background:linear-gradient(120deg,#111827 20%,#3B6BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid .card{position:relative;overflow:hidden}
.grid .card::after{content:'';position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:var(--lime);opacity:.55}
.grid .card:nth-child(2)::after{background:#BFD2FF}.grid .card:nth-child(3)::after{background:#FFD0CB}
.lcard{transition:.2s}.lcard:hover{transform:translateX(4px)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.two2 .card{margin:0}
.phrase{font:600 24px Unbounded,sans-serif;letter-spacing:-.03em;margin:8px 0 4px}
.xp{height:12px;border-radius:9px;background:#EEF0F3;overflow:hidden;margin:8px 0 12px}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--en),var(--fr));border-radius:9px;transition:width 1s}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{padding:6px 12px;border-radius:99px;background:#F0F2F6;color:#9CA3AF;font-weight:600;font-size:13px;filter:grayscale(1);opacity:.7}.badge.on{background:var(--lime);color:var(--ink);filter:none;opacity:1}
.hwc{border-left:6px solid var(--x,#E5E7EB)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fb{background:#FFF8E6;border-radius:14px;padding:10px 14px;margin-top:8px}.fb b{display:block;font-size:12px;color:#9A5B00}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{border:0;background:#fff;padding:8px 14px;border-radius:99px;font-weight:600;cursor:pointer;color:var(--mute);box-shadow:0 6px 16px -12px rgba(17,24,39,.5);transition:.15s}.fchip.on{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:0;border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;background:#F3F5F7;transition:.15s}
.chip:hover{transform:translateY(-2px)}.chip.late{box-shadow:inset 0 0 0 2px var(--zh)}.chip.s-plain{cursor:default}
.s-submitted{background:var(--lime)!important}.s-checked{background:#CFF3E6!important;color:#0B7A5A}.s-returned{background:#FFE7C2!important;color:#9A5B00}
.bar{height:8px;border-radius:9px;background:#EEF0F3;display:flex;overflow:hidden;margin:10px 0}.bar i{height:100%;transition:width .6s}.bar .ok{background:var(--fr)}.bar .wt{background:var(--lime)}
.chip a{cursor:pointer;color:var(--zh);margin-left:4px}
#modal{position:fixed;inset:0;background:rgba(17,24,39,.45);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;opacity:0;transition:opacity .25s;padding:16px}
#modal.show{opacity:1}
.sheet{background:#fff;border-radius:28px;padding:26px;width:100%;max-width:540px;max-height:90vh;overflow:auto;transform:translateY(40px) scale(.92);transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
#modal.show .sheet{transform:none}
.drop{display:grid;justify-items:center;gap:4px;padding:24px;border:2px dashed #C7CDD6;border-radius:20px;cursor:pointer;text-align:center;transition:.2s;margin:0!important;color:var(--ink)!important;font-size:15px!important}
.drop:hover{border-color:var(--en);background:#F2F6FF;transform:scale(1.01)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}.thumbs img,.gal img{object-fit:cover;border-radius:12px}.thumbs img{width:72px;height:72px;animation:up .3s backwards}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}.gal img{width:100%;height:120px}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
#toast{z-index:60}
.chat{display:grid;grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 200px);min-height:440px}
.clist,.cpane{background:#fff;border-radius:24px;box-shadow:0 12px 32px -18px rgba(17,24,39,.3);overflow:hidden}
.clist{overflow:auto;padding:10px}
.ci{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;cursor:pointer;border:0;background:none;width:100%;text-align:left;transition:.15s}
.ci.on,.ci:hover{background:#F3F5F7}.ci .grow{flex:1;min-width:0}
.ci small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px}
.cpane{display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.back{display:none}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:76%;padding:9px 14px;border-radius:18px 18px 18px 6px;background:#F0F2F6;align-self:flex-start;animation:pop .25s;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:18px 18px 6px 18px}
.bub b{display:block;font-size:12px;color:var(--en)}.bub small{display:block;font-size:11px;opacity:.55;text-align:right}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}}
.nochat{margin:auto;text-align:center;color:var(--mute);font-size:15px;padding:20px}
.emo{display:flex;gap:6px;padding:8px 14px 0}.emo button{border:0;background:#F3F5F7;border-radius:10px;padding:4px 9px;cursor:pointer;font-size:16px;transition:.15s}.emo button:hover{transform:scale(1.2)}
.comp{display:flex;gap:8px;padding:10px 14px 14px}.comp input{flex:1}

#bgfx i:nth-child(2){width:300px;height:300px;right:-70px;top:-60px;background:var(--c2);animation:dr2 76s ease-in-out infinite alternate}
#bgfx i:nth-child(3){width:420px;height:420px;left:32%;bottom:-170px;background:var(--c3);animation:dr3 90s ease-in-out infinite alternate}
#bgfx i:nth-child(4){width:240px;height:240px;right:12%;bottom:14%;background:var(--c4);animation:dr4 72s ease-in-out infinite alternate}

@keyframes dr3{to{transform:translate(-160px,-60px) scale(1.1)}}@keyframes dr4{to{transform:translate(-90px,-100px) scale(1.15)}}
@keyframes drm{to{transform:translate(40px,30px) scale(1.05)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
main :is(.row,.lcard,.chip,.bd){animation:fi .45s cubic-bezier(.2,.8,.2,1) backwards}

html[data-lang] main>h1::before,html[data-lang] main>h1::after{color:var(--lc);-webkit-text-fill-color:var(--lc);font-family:Georgia,'Noto Serif',serif;font-weight:400}
html[data-lang=en] main>h1::before{content:'“'}html[data-lang=en] main>h1::after{content:'”'}
html[data-lang=zh] main>h1::before{content:'「'}html[data-lang=zh] main>h1::after{content:'」'}

html[data-lang=en] .banner::after{content:'Aa Zz'}html[data-lang=zh] .banner::after{content:'汉 语'}

html[data-lang=fr] .banner .lbl::after{content:' · Bonjour'}html[data-lang=de] .banner .lbl::after{content:' · Hallo'}

async function load(){

    db.from('profiles').select('*'), db.from('languages').select('*'), db.from('schedule').select('*'),
    db.from('homework').select('*'), db.from('grades').select('*').order('created_at', {ascending:false}),

  const bad = r.slice(0, 7).find(x => x.error); if (bad) throw bad.error;
  const kc = c => { c = String(c || '').toLowerCase().slice(0, 2); return c === 'cn' ? 'zh' : c; };

  LG.forEach(l => { l.key = kc(l.code) || l.name; LGK[l.key] = l; LANG[l.key] = l.name; });
  const key = x => {
    const l = LG.find(g => g.id === x.language_id) || (x.language && LG.find(g => g.name === x.language || kc(g.code) === kc(x.language)));
    const k = l ? l.key : (x.language || '—'); if (!LANG[k]) LANG[k] = x.language || k; return k;
  };
  P = Object.fromEntries(r[0].data.map(x => [x.id, x]));
  SUB = r[6].data; G = Object.fromEntries((r[7].data || []).map(g => [g.id, g.name]));
  GRP = (r[7].data || []).map(g => ({...g, language:g.language ? key(g) : null})); GM = r[8].data || [];
  CM = {}; (r[9].data || []).slice().reverse().forEach(m => (CM[m.channel] ||= []).push(m));
  const st = h => (SUB.find(s => s.homework_id === h.id && s.student_id === h.student_id) || {}).status || 'not_submitted';

    .sort((a, b) => a.starts_at < b.starts_at ? -1 : 1);
  HW = r[3].data.map(h => ({...h, language:key(h), due_on:h.due_date, assigned_on:(h.created_at || '').slice(0, 10), status:st(h)}))
    .sort((a, b) => String(a.due_on) < String(b.due_on) ? -1 : 1);
  GR = r[4].data.map(g => { const k = g.grade_type || g.type || '—'; if (!KIND[k]) KIND[k] = [k, 1]; return {...g, language:key(g), kind:k, value:g.value ?? g.grade}; });
  TL = r[5].data.map(t => ({...t, language:(LG.find(l => l.id === t.language_id) || {}).key})).filter(t => t.language);
  if (me) {

    if (!me.langs.length && Array.isArray(me.languages)) me.langs = me.languages.map(n => key({language:n}));
  }
}

/* ---------- schedule ---------- */
function chains(list){
  const out = [];
  list.forEach(l => {
    const c = out[out.length - 1], day = new Date(l.starts_at).toDateString();
    if (c && c.day === day && c.end === +new Date(l.starts_at)) { c.items.push(l); c.end = +new Date(l.ends_at); }
    else out.push({day, end:+new Date(l.ends_at), items:[l]});
  });
  return out;
}
const lessonWho = l => me.role === 'student' ? nm(l.teacher_id)
  : (l.group_id && !l.student_id ? 'Группа: ' + (G[l.group_id] || '') : (me.role === 'teacher' ? nm(l.student_id) : nm(l.teacher_id) + ' · ' + nm(l.student_id)));
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let wk = 0, sel = iso(new Date()), cuRole = 'student', lastCreated = null;
const lessonCard = (l, home) => `<div class="lcard t-${l.language}"><div class="lt">${home ? `<small>${new Date(l.starts_at).toLocaleDateString('ru', {day:'numeric', month:'short'})}</small>` : ''}<b>${fmtT(l.starts_at)}</b><span>${fmtT(l.ends_at)}</span></div>
  <div class="lb"><b>${e(LANG[l.language])}</b><small>${e(lessonWho(l))}${l.title ? ' · ' + e(l.title) : ''}</small></div>
  ${!home && isStaff() ? `<button class="btn del" onclick="delRow('schedule','${l.id}')">Удалить</button>` : ''}</div>`;
const chainHtml = (list, home) => chains(list).map(c => `<div class="lchain">${c.items.map(l => lessonCard(l, home)).join('')}</div>`).join('');
function weekDays(){
  const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + wk * 7);
  return [...Array(7)].map((_, i) => { const d = new Date(t); d.setDate(t.getDate() + i); return d; });
}
function pickDay(d){ sel = d; go('schedule'); }
function shiftWeek(n){ wk += n; sel = iso(wk === 0 ? new Date() : weekDays()[0]); go('schedule'); }
function scheduleView(){
  const days = weekDays(), today = iso(new Date()), at = k => LES.filter(l => l.starts_at.slice(0, 10) === k);
  const f = d => d.toLocaleDateString('ru', {day:'numeric', month:'long'});
  let html = '<h1>Расписание</h1><p class="sub">Выберите день недели. Уроки подряд собраны в одну группу.</p>';
  if (isStaff()) html += `<details class="card"><summary>Добавить занятие</summary><form onsubmit="return addLesson(event)">
    <div class="two"><div><label>Кому (группа или ученик)</label><select name="st" required>${whoOpts()}</select></div><div><label>Язык (для ученика)</label><select name="lg" required>${lgOpts()}</select></div>
    <div><label>Дата</label><input type="date" name="d" value="${sel}" required></div><div></div>
    <div><label>Начало</label><input type="time" name="s" required></div><div><label>Окончание</label><input type="time" name="t" required></div></div>
    <button class="btn" style="margin-top:18px">Добавить занятие</button></form></details>`;
  html += `<div class="wkhead"><button class="btn ghost" onclick="shiftWeek(-1)">Назад</button><b>${f(days[0])} — ${f(days[6])}</b><button class="btn ghost" onclick="shiftWeek(1)">Вперёд</button></div>
    <div class="week">${days.map(d => { const k = iso(d);
      return `<button class="dayb ${k === sel ? 'on' : ''} ${k === today ? 'today' : ''}" onclick="pickDay('${k}')"><small>${d.toLocaleDateString('ru', {weekday:'short'})}</small><b>${d.getDate()}</b><span class="dots">${[...new Set(at(k).map(l => l.language))].map(g => `<i class="c-${g}"></i>`).join('')}</span></button>`; }).join('')}</div>
    <div class="day">${fmtD(sel + 'T00:00')}</div>`;
  return html + (at(sel).length ? chainHtml(at(sel)) : '<div class="card empty">В этот день занятий нет.</div>');
}
function addLesson(ev){
  ev.preventDefault(); const f = new FormData(ev.target), d = f.get('d'), s = f.get('s'), t = f.get('t'), [kind, who] = f.get('st').split(':');
  if (t <= s) { toast('Окончание должно быть позже начала'); return false; }
  tryIns('schedule', {...(kind === 'g' ? groupRow(who) : rowOf(who, f.get('lg'))), start_time:s, end_time:t, created_by:me.id}, [{lesson_date:d, date:d}, {lesson_date:d}, {date:d}], 'Занятие добавлено');
  return false;
}
const delRow = (t, id) => confirm('Удалить запись?') && run(db.from(t).delete().eq('id', id), 'Удалено');

/* ---------- grades ---------- */
function gradesView(){
  let html = '<h1>Оценки</h1><p class="sub">Средний балл считается с учётом веса: КР — 3, Проверочная — 2, Тест — 1,5, Р/У и ДЗ — 1.</p>';
  if (isStaff()) html += `<details class="card"><summary>Выставить оценку</summary><form onsubmit="return addGrade(event)">

    <div><label>Тип</label><select name="kind">${['ДЗ','Тест','Р/У','Проверочная','КР'].map(k => `<option>${k}</option>`).join('')}</select></div>
    <div><label>Оценка</label><select name="v">${[5,4,3,2,1].map(n => `<option>${n}</option>`).join('')}</select></div></div>
    <label>Комментарий</label><input name="c" maxlength="200">
    <button class="btn" style="margin-top:18px">Сохранить оценку</button></form></details>`;
  if (!GR.length) return html + '<div class="card empty">Оценок пока нет.</div>';
  const by = {}; GR.forEach(g => (by[g.language] ||= []).push(g));
  Object.entries(by).forEach(([l, list]) => {

    html += list.map(g => `<div class="row">${gpill(g)}<div class="grow">${isStaff() ? `<b>${e(nm(g.student_id))}</b>` : ''}<small>${e(g.comment || '')} ${new Date(g.created_at).toLocaleDateString('ru')}</small></div>
      ${isStaff() ? `<button class="btn del" onclick="delRow('grades','${g.id}')">Удалить</button>` : ''}</div>`).join('') + '</div>';

function addGrade(ev){
  ev.preventDefault(); const f = new FormData(ev.target), k = f.get('kind'), v = +f.get('v');
  tryIns('grades', {...rowOf(f.get('st'), f.get('lg')), comment:f.get('c') || null, what:f.get('c') || k},
    [{grade_type:k, type:k, value:v, grade:v}, {grade_type:k, value:v}, {grade_type:k, grade:v}, {type:k, grade:v}, {type:k, value:v}], 'Оценка сохранена');
  return false;
}

/* ---------- homework ---------- */
let hwF = 'all', hwTab = 'check';
const subOf = h => SUB.find(s => s.homework_id === h.id && s.student_id === h.student_id);
const bkey = h => h.batch_id || h.id;

const lateOf = h => h.status === 'not_submitted' && h.due_on < iso(new Date());
const GV = (k, v) => [{grade_type:k, type:k, value:v, grade:v}, {grade_type:k, value:v}, {grade_type:k, grade:v}, {type:k, grade:v}, {type:k, value:v}];

function hwForm(){

  <label>Группы (задание получат все участники)</label><div class="chk">${myGroups().map(g => `<label><input type="checkbox" name="tg" value="${g.id}">${dot(g.language)}${e(g.name)}</label>`).join('') || '<span class="empty">Групп пока нет — создайте во вкладке «Группы»</span>'}</div>
  <label>Отдельные ученики</label><div class="chk" style="max-height:130px;overflow:auto">${myStudents().map(p => `<label><input type="checkbox" name="st" value="${p.id}">${e(p.full_name)}</label>`).join('') || '<span class="empty">Нет учеников</span>'}</div>
  <div class="two"><div><label>Язык (для отдельных учеников)</label><select name="lg" required>${lgOpts()}</select></div><div><label>Срок сдачи</label><input type="date" name="due" required></div></div>
  <label>Название</label><input name="title" required maxlength="120"><label>Описание</label><textarea name="desc" rows="3"></textarea>
  <button class="btn" style="margin-top:18px">Выдать задание</button></form></details>`;
}
function homeworkView(){
  const html = '<h1>Домашняя работа</h1><p class="sub">' + (isStaff() ? 'Задания по группам и индивидуально. Проверка — по вкладке «На проверку».' : 'Задания, сроки и сдача с фото.') + '</p>' + (isStaff() ? hwForm() : '');
  if (!HW.length) return html + '<div class="card empty">Заданий пока нет.</div>';
  return html + (isStaff() ? staffHw() : studentHw());
}
function staffHw(){
  const all = Object.values(HW.reduce((m, h) => ((m[bkey(h)] ||= []).push(h), m), {}));
  const gids = [...new Set(HW.map(h => h.group_id).filter(Boolean))];
  const nc = HW.filter(h => h.status === 'submitted').length;
  let list = all.filter(b => hwF === 'all' || (hwF === 'solo' ? !b[0].group_id : b[0].group_id === hwF));
  if (hwTab === 'check') list = list.filter(b => b.some(h => h.status === 'submitted'));
  list.sort((a, b) => String(a[0].due_on) < String(b[0].due_on) ? -1 : 1);
  return `<div class="seg"><button class="${hwTab === 'check' ? 'on' : ''}" onclick="hwTab='check';go('homework')">На проверку${nc ? ' · ' + nc : ''}</button><button class="${hwTab === 'all' ? 'on' : ''}" onclick="hwTab='all';go('homework')">Все задания</button></div>
  <div class="filters">${[['all', 'Все'], ...gids.map(g => [g, '👥 ' + (G[g] || 'Группа')]), ['solo', '👤 Индивидуальные']].map(([k, t]) => `<button class="fchip ${hwF === k ? 'on' : ''}" onclick="hwF='${k}';go('homework')">${e(t)}</button>`).join('')}</div>
  ${list.length ? list.map(batchCard).join('') : `<div class="card empty">${hwTab === 'check' ? 'Работ на проверку нет 🎉' : 'Заданий нет.'}</div>`}`;

function batchCard(b){
  const h = b[0], n = b.length, ch = b.filter(x => x.status === 'checked').length, sb = b.filter(x => x.status === 'submitted').length, k = bkey(h);
  const who = h.group_id ? '👥 ' + e(G[h.group_id] || 'Группа') : '👤 ' + e(nm(h.student_id));
  return `<div class="card hwc t-${h.language}"><div class="row" style="border:0;padding:0 0 6px"><div class="grow"><h3 style="margin:0">${dot(h.language)}${e(h.title)}</h3><small class="lbl">${e(LANG[h.language])} · ${who} · срок ${h.due_on ? fmtS(h.due_on) : '—'}</small></div>
    <span class="pill ${sb ? 'kr' : ''}">${sb ? sb + ' на проверку' : ch + '/' + n + ' принято'}</span></div>
    ${h.description ? `<p>${e(h.description)}</p>` : ''}
    <div class="bar"><i class="ok" style="width:${ch / n * 100}%"></i><i class="wt" style="width:${sb / n * 100}%"></i></div>
    <div class="chips">${b.map(x => `<button class="chip s-${x.status} ${lateOf(x) ? 'late' : ''}" onclick="reviewHw('${x.id}')">${SI[x.status]} ${e(nm(x.student_id))}</button>`).join('')}</div>
    <div class="acts"><button class="btn ghost" onclick="editHw('${k}')">Изменить</button><button class="btn del" onclick="delHw('${k}')">Удалить</button></div></div>`;
}
function studentHw(){
  const rank = h => h.status === 'checked' ? 2 : h.status === 'submitted' ? 1 : 0;

    if (sp) {
      const its = S.items.filter(i => i.season === sp.key).sort((a, b) => a.season_need - b.season_need), got = its.filter(i => S.inv.has(i.code)).length;
      h += `<div class="pt-season se-${esc(sp.key.replace(/\d+/, ''))}"><div class="pt-sh"><b>${esc(sp.icon)} ${esc(sp.name)}</b><span>${got} / ${its.length} наград</span></div><div class="pt-bar"><i style="width:${its.length ? got / its.length * 100 : 0}%"></i></div><div class="pt-sub" style="margin:6px 0 10px">${me.role === 'teacher' ? 'Выставлено оценок в сезоне' : 'Сдано ДЗ в сезоне'}: ${S.prog.sc} · сезон до ${fmtD(sp.end_on)}. Полученные предметы остаются навсегда.</div><div class="pt-tiles">${its.map(i => tile(i, S.inv.has(i.code), i.season_need + ' ' + (me.role === 'teacher' ? 'оц.' : 'ДЗ'))).join('')}</div></div>`;
    }
    const old = [...S.inv].map(item).filter(i => i && i.season && (!sp || i.season !== sp.key));
    if (old.length) h += `<div class="pt-lbl">Коллекционные сезонные предметы</div><div class="pt-tiles">${old.map(i => tile(i, true)).join('')}</div>`;
    const mine = myLangs(), tch = me.role === 'teacher', known = k => (typeof LANG === 'undefined' || !Object.keys(LANG).length || LANG[k]) && (!mine || mine.has(k)), unit = tch ? 'оц.' : 'ДЗ';
    [...new Set(S.items.filter(i => i.lang).map(i => i.lang))].filter(known).forEach(k => {
      const its = S.items.filter(i => i.lang === k).sort((a, b) => a.lang_need - b.lang_need), own = its.filter(i => S.inv.has(i.code)).length, f = FL[k] || ['🌐', (typeof LANG !== 'undefined' && LANG[k]) || k];
      h += `<div class="pt-season lang"><div class="pt-sh"><b>${f[0]} ${esc((typeof LANG !== 'undefined' && LANG[k]) || f[1])}</b><span>${own}/${its.length} предметов · ${its.length ? Math.round(own / its.length * 100) : 0}%</span></div><div class="pt-bar"><i style="width:${its.length ? own / its.length * 100 : 0}%"></i></div><div class="pt-sub" style="margin:6px 0 10px">${tch ? 'Выставлено оценок по языку' : 'Сдано ДЗ по языку'}: ${S.prog.langs[k] || 0}</div><div class="pt-tiles">${its.map(i => tile(i, S.inv.has(i.code), i.lang_need + ' ' + unit)).join('')}</div></div>`;
    });
    return h.includes('pt-season lang') || sp ? h : '<div class="pt-hint">Коллекции появятся, когда у тебя появится язык: у ученика — учебный, у учителя — преподаваемый.</div>';
  }
  function storyHTML(){
    const p = S.pet, days = Math.max(1, Math.ceil((Date.now() - new Date(p.created_at)) / 864e5)), first = pre => S.ledger.filter(l => l.key.startsWith(pre)).map(l => l.created_at).sort()[0];
    const ach = Object.values(S.achAt).sort()[0], rare = [...S.inv].map(item).filter(i => i && i.rarity !== 'common').map(i => S.invAt[i.code]).filter(Boolean).sort()[0];
    const ev = [['⭐','Первый день',p.created_at],['📚','Первое ДЗ',first('hw:')],['🎓','Первое повышение уровня',first('lvl:')],['🏆','Первое достижение',ach],['🌟','Первый редкий предмет',rare]];
    return `<div class="pt-season"><div class="pt-sh"><b>${esc(p.name)}</b><span>Дней в LanLand: ${days}</span></div><div class="pt-sub">Создан: ${fmtD(p.created_at)}</div><div class="pt-lbl">Особые события</div>${ev.map(e => `<div class="pt-ach ${e[2] ? 'ok' : ''}" style="margin-bottom:6px"><span class="ic">${e[0]}</span><div style="flex:1"><b>${e[1]}</b><small>${e[2] ? fmtD(e[2]) : 'ещё впереди'}</small></div></div>`).join('')}</div>
    <div class="pt-lbl">История монет</div>${S.ledger.slice(0, 40).map(l => `<div class="row"><b style="min-width:84px;color:${l.amount > 0 ? '#15803D' : '#DC2626'}">${l.amount > 0 ? '+' : ''}${l.amount} 🪙</b><div class="grow">${esc(why(l))}<small>${fmtDT(l.created_at)}</small></div></div>`).join('') || '<div class="pt-hint">Пока операций нет.</div>'}`;
  }
  const slotCard = (slot, code, label, ic, sw, it) => `<button class="pt-card r-${it ? it.rarity : 'common'} ${((S.pet.outfit || {})[slot] || null) === code ? 'on' : ''}" data-eq="${slot}" data-code="${code || ''}" ${it && RAR[it.rarity] ? `data-r="${RAR[it.rarity]}"` : ''}>${sw ? `<span class="sw" style="background:${sw}"></span>` : `<span class="ic">${ic}</span>`}<b>${esc(label)}</b></button>`;
  function tabHTML(){
    const p = S.pet, t = S.tab, own = [...S.inv].map(item).filter(Boolean);
    if (t === 'pet') {
      const cols = COLORS[p.type], coats = own.filter(i => i.category === 'pet');
      if (!cols && !coats.length) return '<div class="pt-hint">Для этого питомца пока один фирменный окрас. Новые появятся в магазине.</div>';
      return `<div class="pt-grid">${Object.entries(cols || {}).map(([k, v]) => `<button class="pt-card ${p.color === k ? 'on' : ''}" data-eq="color" data-code="${k}"><span class="sw" style="background:${k === 'spotted' ? `radial-gradient(circle at 30% 35%,#8A5A3C 0 22%,transparent 24%),${v[1]}` : v[1]}"></span><b>${v[0]}</b></button>`).join('')}${coats.map(i => `<button class="pt-card r-${i.rarity} ${p.color === i.code ? 'on' : ''}" data-eq="color" data-code="${i.code}" data-r="${RAR[i.rarity]}"><span class="sw" style="background:${i.asset}"></span><b>${esc(i.name)}</b></button>`).join('')}</div>`;
    }
    if (t === 'furn') {
      const f = own.filter(i => i.category === 'furn' || i.category === 'decor'), en = own.filter(i => i.category === 'env');
      return `<div class="pt-grid">${f.map(i => `<div class="pt-card" style="cursor:default"><span class="ic">${i.code === 'cat_rug' ? '🟫' : esc(i.asset)}</span><b>${esc(i.name)}</b></div>`).join('')}</div><div class="pt-hint">Расставляй предметы кнопкой «Редактировать комнату». Новые вещи — в магазине.</div>
      <div class="pt-lbl">Фон</div><div class="pt-grid">${slotCard('env', '', 'Обычный', '☀️')}${en.map(i => slotCard('env', i.code, i.name, i.asset, 0, i)).join('')}</div>`;
    }
    const list = own.filter(i => i.category === t);
    return `<div class="pt-grid">${slotCard(t, '', 'Без ' + (t === 'hat' ? 'шапки' : t === 'cloth' ? 'одежды' : 'аксессуара'), '✕')}${list.map(i => slotCard(t, i.code, i.name, i.asset, 0, i)).join('')}</div>${list.length ? '' : '<div class="pt-hint">Пока пусто — загляни в магазин или выполняй задания.</div>'}`;
  }
  function shopHTML(){
    const t = S.shop, p = S.pet, list = S.items.filter(i => i.category === t && (!i.pet_type || i.pet_type === p.type)).sort((a, b) => a.price - b.price);
    return `<div class="pt-dock" style="padding-top:0">${SHOP.map(c => `<button class="pt-tab ${t === c[0] ? 'on' : ''}" data-shop="${c[0]}">${c[1]}</button>`).join('')}</div><div class="pt-grid">${list.map(i => {
      const has = S.inv.has(i.code), lock = i.unlock_ach, a = lock && ACH.find(x => x[0] === lock);
      const vis = i.category === 'pet' ? `<span class="sw" style="background:${i.asset}"></span>` : `<span class="ic">${i.code === 'cat_rug' ? '🟫' : esc(i.asset)}</span>`;
      return `<div class="pt-card r-${i.rarity} ${has ? 'on' : ''} ${lock && !has ? 'lock' : ''}" ${RAR[i.rarity] ? `data-r="${RAR[i.rarity]}"` : ''} ${has || lock ? '' : `data-buy="${esc(i.code)}"`}>${vis}<b>${esc(i.name)}</b><span class="pr">${has ? '✓ Твоё' : lock ? '🔒 ' + (a ? a[2] : 'награда') : i.price === 0 ? 'Бесплатно' : '🪙 ' + i.price}</span></div>`;
    }).join('') || '<div class="pt-hint">Здесь пока пусто.</div>'}</div>`;
  }
  function achHTML(){
    return ACH.map(a => `<div class="pt-ach ${S.ach.has(a[0]) ? 'ok' : ''}"><span class="ic">${a[1]}</span><div style="flex:1"><b>${a[2]}</b><small>${a[3]}</small></div><span class="pill ${S.ach.has(a[0]) ? 'kr' : ''}">${S.ach.has(a[0]) ? '✓ ' : ''}${a[4]}</span></div>`).join('') + (me.role === 'teacher' ? '<div class="pt-hint">Учителю: +2 🪙 за каждую выставленную оценку (до 5 оценок в день).</div>' : '') + '<div class="pt-hint">Монетки приходят за ДЗ (+5), оценки (3→+4, 4→+7, 5→+10), новые уровни (+50) и серии из 7 дней (+30).</div>';
  }

  /* --- действия в комнате --- */
  function bindScene(){
    const b = modal.querySelector('.pt-box');
    b.onclick = async ev => {
      const t = ev.target.closest('[data-tab],[data-a],[data-eq],[data-buy],[data-shop]'); if (!t) return;
      const d = t.dataset;
      if (d.tab) { S.tab = d.tab; S.view = 'room'; render(); }
      else if (d.shop) { S.shop = d.shop; render(); }
      else if (d.a === 'x') close();
      else if (d.a === 'shop') { S.view = 'shop'; render(); } else if (d.a === 'ach') { S.view = 'ach'; render(); }
      else if (d.a === 'edit') { S.edit = true; render(); }
      else if (d.a === 'coll') { S.view = 'coll'; render(); } else if (d.a === 'story') { S.view = 'story'; render(); }
      else if (d.a === 'play') { if (Date.now() - playT < 2500) return; playT = Date.now(); act({cat:'play', dog:'play', panda:'eat', fox:'play', penguin:'slide'}[S.pet.type]); setMood('joy'); }
      else if (d.a === 'snap') snap();
      else if (d.a === 'done') saveRoom(t);
      else if (d.eq) {
        const slot = d.eq, code = d.code || null, o = {...(S.pet.outfit || {})};
        try { await rpc('pet_equip', {p_slot:slot, p_code:slot === 'color' ? code : code}); }
        catch (_) { return; }
        if (slot === 'color') S.pet.color = code; else { if (code) o[slot] = code; else delete o[slot]; S.pet.outfit = o; }
        renderFab(); render(); if (code && slot !== 'color' && slot !== 'env') act('hop');
      }
      else if (d.buy) {
        const it = item(d.buy); t.style.pointerEvents = 'none';
        try { const r = await rpc('pet_buy', {p_code:d.buy}); S.coins = r.coins; S.inv.add(d.buy); S.last = 0; render(); bump(); act('hop'); toast(`Куплено: ${it.name} ✓`);
          const c = modal.querySelector(`[data-shop="${S.shop}"]`); modal.querySelectorAll('.pt-card.on').forEach(x => x.classList.add('bought')); } catch (_) { t.style.pointerEvents = ''; }
      }
    };
  }
  async function saveRoom(btn){
    btn.disabled = true;
    try { await rpc('pet_save_room', {p_items:placed().map(i => ({code:i.code, x:Math.round(i.x * 10) / 10, y:Math.round(i.y * 10) / 10}))}); placed().forEach(i => S.room[i.code] = {x:i.x, y:i.y}); S.edit = false; render(); toast('Комната сохранена ✓'); }
    catch (_) { btn.disabled = false; }
  }
  // drag & drop (мышь + touch через Pointer Events), предметы не выходят за сцену
  let drag = null;
  document.addEventListener('pointerdown', ev => {
    if (!S.edit) return; const el = ev.target.closest && ev.target.closest('#ptScene .pt-it'); if (!el) return;
    const r = el.getBoundingClientRect(); drag = {el, code:el.dataset.c, dx:ev.clientX - (r.left + r.width / 2), dy:ev.clientY - r.bottom};
    el.classList.add('drag'); el.setPointerCapture && el.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  document.addEventListener('pointermove', ev => {
    if (!drag) return; const r = drag.el.parentElement.getBoundingClientRect();
    const x = Math.min(96, Math.max(4, (ev.clientX - drag.dx - r.left) / r.width * 100)), y = Math.min(96, Math.max(30, (ev.clientY - drag.dy - r.top) / r.height * 100));
    drag.el.style.left = x + '%'; drag.el.style.top = y + '%'; drag.el.style.zIndex = Math.round(y); S.room[drag.code] = {x:+x.toFixed(1), y:+y.toFixed(1)};
  });
  const endDrag = () => { if (drag) { drag.el.classList.remove('drag'); drag = null; } };
  document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);

  /* --- живой питомец: редкие случайные idle-анимации --- */
  function act(name, em){
    const mv = document.getElementById('ptMv'); if (!mv || !S.pet) return;
    const m = {play:'hop', slide:'slide', walk:'walk', roll:'roll'}[name] || name, prop = document.getElementById('ptProp');
    mv.className = 'pt-mv'; void mv.offsetWidth; mv.className = 'pt-mv a-' + m;
    if ((name === 'play' || name === 'eat' || em) && prop) { prop.textContent = em || (name === 'eat' ? PROP.panda : PROP[S.pet.type]); prop.classList.remove('on'); void prop.offsetWidth; prop.classList.add('on'); }
    setTimeout(() => { if (mv.isConnected) mv.className = 'pt-mv'; }, 4200);
  }
  function scheduleIdle(){
    clearTimeout(idleT); if (!S.open || !S.pet || S.edit || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    idleT = setTimeout(() => { const l = sleeping() ? ['sit', 'lie'] : IDLE[S.pet.type]; if (document.hidden === false) act(l[Math.floor(Math.random() * l.length)]); scheduleIdle(); }, 5000 + Math.random() * 5000);
  }

  /* ---------- фото мира (canvas) ---------- */
  async function snap(){
    const p = S.pet, o = p.outfit || {}, W = 1200, H = 675, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    const BG = {cat:['#EFE8DE','#D2BFA2',.6], dog:['#CDE8F6','#9CCB7F',.55], panda:['#DDEED3','#8FB57B',.58], fox:['#F6E2C4','#B97A44',.62], penguin:['#D9EAF5','#BDD8EA',.6]}[p.type];
    x.fillStyle = BG[0]; x.fillRect(0, 0, W, H); x.fillStyle = BG[1]; x.fillRect(0, H * BG[2], W, H);
    const tint = {env_sunset:'rgba(255,120,60,.22)', env_night:'rgba(18,26,70,.45)', env_dawn:'rgba(255,170,200,.22)'}[o.env] || (!o.env && period() === 'night' ? 'rgba(18,26,70,.4)' : ''); if (tint) { x.fillStyle = tint; x.fillRect(0, 0, W, H); }
    x.textAlign = 'center'; x.textBaseline = 'bottom';
    placed().sort((a, b) => a.y - b.y).forEach(i => { const px = i.x / 100 * W, py = i.y / 100 * H; if (i.code === 'cat_rug') { x.fillStyle = '#B4846A'; x.beginPath(); x.ellipse(px, py - 14, 130, 30, 0, 0, 7); x.fill(); } else { x.font = (i.category === 'decor' ? 72 : 108) + 'px serif'; x.fillText(i.asset, px, py); } });
    const img = new Image(), s = svg(p.type, p.color, o).replace('<svg ', '<svg width="312" height="328" ');
    await new Promise(res => { img.onload = res; img.onerror = res; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); });
    x.drawImage(img, W / 2 - 156, H * .98 - 328, 312, 328);
    x.fillStyle = 'rgba(255,255,255,.92)'; x.beginPath(); x.roundRect ? x.roundRect(28, 28, 60 + p.name.length * 24, 64, 20) : x.rect(28, 28, 60 + p.name.length * 24, 64); x.fill();
    x.fillStyle = '#111827'; x.font = '600 34px Unbounded, Onest, sans-serif'; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText(p.name, 52, 61);
    [['#3B6BFF', 0, 0], ['#FF5A4F', 1, 0], ['#16B38A', 0, 1], ['#FFA620', 1, 1]].forEach(m => { x.fillStyle = m[0]; x.fillRect(W - 210 + m[1] * 14, H - 62 + m[2] * 14, 12, 12); });
    x.fillStyle = '#111827'; x.font = '600 28px Unbounded, Onest, sans-serif'; x.fillText('LanLand', W - 176, H - 49);
    c.toBlob(async b => {
      const f = new File([b], `${p.name}-lanland.png`, {type:'image/png'});
      try { if (navigator.canShare && navigator.canShare({files:[f]})) { await navigator.share({files:[f], title:'Мой мир в LanLand'}); return; } } catch (_) {}
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Снимок сохранён 📸');
    });
  }

  /* ---------- админ: выдача монет и история (проверка роли — на сервере в pet_admin_*) ---------- */
  function adminUI(){
    if (!me || me.role !== 'admin' || page !== 'users') return;
    const main = document.querySelector('#main'), sub = main.querySelector('.sub');
    if (sub) sub.insertAdjacentHTML('afterend', '<button class="btn ghost" style="margin:-10px 0 16px" onclick="PetSystem.historyUI()">🪙 История монет</button>');
    main.querySelectorAll('.row').forEach(row => {
      const sel = row.querySelector('select[onchange^="setRole"]'); if (!sel) return;
      const m = /setRole\('([^']+)'/.exec(sel.getAttribute('onchange')), p = m && P[m[1]]; if (!p || !['student', 'teacher'].includes(p.role)) return;
      sel.insertAdjacentHTML('beforebegin', `<button class="btn lime" style="padding:8px 12px;white-space:nowrap" onclick="PetSystem.grantUI('${p.id}')">🪙 Выдать</button>`);
    });
  }
  function grantUI(id){
    const p = P[id]; if (!p) return;
    openModal(`<h2 style="font-size:22px">Выдать монеты</h2><p class="lbl" style="margin:6px 0 4px">${p.role === 'teacher' ? 'Учитель' : 'Ученик'}: <b style="color:var(--ink)">${esc(p.full_name)}</b></p>
      <label>Количество</label><input id="ptAmt" type="number" min="1" max="100000" step="1" value="100"><label>Причина</label><input id="ptWhy" maxlength="80" value="Награда от администратора">
      <div class="acts" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn lime" id="ptGo">Выдать</button></div>`);
    document.getElementById('ptGo').onclick = async ev => {
      const n = Math.floor(+document.getElementById('ptAmt').value); if (!(n >= 1 && n <= 100000)) return toast('Введите количество от 1 до 100000');
      ev.target.disabled = true;
      try { await rpc('pet_admin_grant', {p_user:id, p_amount:n, p_reason:document.getElementById('ptWhy').value.trim()}); closeModal(); toast(`${P[id].role === 'teacher' ? 'Учителю' : 'Ученику'} выдано ${n} монет`); } catch (_) { ev.target.disabled = false; }
    };
  }
  async function historyUI(){
    let rows; try { rows = await rpc('pet_admin_history'); } catch (_) { return; }
    openModal(`<h2 style="font-size:22px">История выдачи монет</h2><div style="max-height:60vh;overflow:auto;margin-top:10px">${(rows || []).map(r => `<div class="row"><div class="grow"><b>${esc(r.user_name || 'Ученик')}</b><small>${esc(r.reason || 'Награда от администратора')} · Выдал: ${esc(r.by_email || '—')} · ${fmtDT(r.created_at)}</small></div><span class="pill kr">+${r.amount} 🪙</span></div>`).join('') || '<div class="empty">Выдач пока не было.</div>'}</div><div class="acts" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Закрыть</button></div>`);
  }

  /* ---------- жизненный цикл ---------- */
  async function init(){
    if (!me) return destroy();
    if (!fab) { fab = document.createElement('button'); fab.id = 'ptFab'; fab.type = 'button'; fab.setAttribute('aria-label', 'Мой питомец'); fab.onclick = click; document.body.appendChild(fab); }
    S.lvl = null; await load(); renderFab(); await sync(true);
  }
  function destroy(){ clearTimeout(idleT); if (fab) { fab.remove(); fab = null; } if (modal) { modal.remove(); modal = null; } Object.assign(S, {pet:null, coins:0, inv:new Set(), room:{}, ach:new Set(), open:false, edit:false, lvl:null}); }
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.open) close(); });
  return {init, destroy, sync:() => sync(false), act, adminUI, grantUI, historyUI};
})();

/* ---- подключение к существующему коду (ничего не заменяя, только дополняя) ---- */
(() => {
  const wrap = (name, after) => { const o = window[name]; if (typeof o !== 'function') return; window[name] = function(){ const r = o.apply(this, arguments); try { after(r); } catch (err) { console.warn('[PetSystem]', err); } return r; }; };
  wrap('showApp', () => PetSystem.init());
  wrap('showAuth', () => PetSystem.destroy());
  wrap('go', () => PetSystem.adminUI());
  wrap('refresh', r => Promise.resolve(r).then(() => PetSystem.sync()));
  if (typeof me !== 'undefined' && me && !document.querySelector('#app').classList.contains('hide')) PetSystem.init();
})();
</script>
