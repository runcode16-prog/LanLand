<style>
:root{
 --bg:#f5f6fa;--card:#fff;--line:#e5e7ee;--text:#171923;
 --muted:#737987;--blue:#4f5bd5;--blue2:#eef0ff;
 --red:#dc3545;--green:#16855b

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.muted{color:var(--muted)}
.danger{color:var(--red)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.loginbox{width:390px;max-width:100%;background:#fff;padding:32px;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 40px #0000000a}
.logo{font-size:25px;font-weight:800;margin-bottom:25px}
h1,h2,h3{margin:0 0 16px}
label{display:block;margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:90px}
.btn{padding:10px 15px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600}
.btn.gray{background:#eee;color:#333}
.btn.red{background:var(--red)}
.btn.sm{padding:7px 10px;font-size:12px}
.err{color:var(--red);margin-top:12px}
.app{display:flex;min-height:100vh}
.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0}
.brand{font-size:22px;font-weight:800;padding:5px 10px 22px}
.nav{display:grid;gap:4px}
.nav button{background:none;text-align:left;padding:11px 12px;border-radius:10px;color:#4e5360}
.nav button.active,.nav button:hover{background:var(--blue2);color:var(--blue);font-weight:600}
.main{margin-left:235px;width:calc(100% - 235px);padding:28px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}
.stat b{font-size:26px;display:block;margin-top:7px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.empty{padding:25px;text-align:center;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{min-height:170px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.dayhead{font-weight:700;margin-bottom:9px}
.lesson{background:var(--blue2);padding:9px;border-radius:9px;margin-bottom:7px;font-size:12px}
.lesson b{display:block;margin-bottom:4px}
.modalbg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:20}
.modal{background:#fff;width:600px;max-width:100%;max-height:90vh;overflow:auto;border-radius:17px;padding:22px}
.modalhead{display:flex;justify-content:space-between;gap:10px}
.close{background:#eee;border-radius:8px;width:32px;height:32px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;padding:7px 0;font-weight:400}
.check input{width:auto}
.chat{display:grid;grid-template-columns:220px 1fr;gap:12px;height:65vh}
.people,.messages{background:#fff;border:1px solid var(--line);border-radius:14px}

.person{padding:11px;border-radius:9px;cursor:pointer}
.person:hover{background:var(--blue2)}
.messages{display:flex;flex-direction:column;overflow:hidden}

/* DATE */

function startOfWeek(d=new Date()){
 const x=new Date(d);
 const day=x.getDay()||7;

 x.setDate(x.getDate()-day+1+week*7);
 x.setHours(0,0,0,0);

 return x;
}

/*
 ВАЖНО:
 date input YYYY-MM-DD нельзя превращать
 через new Date(value).toISOString().
 Иначе из-за UTC дата может стать следующим днём.
*/

function iso(d){
 if(typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)){
  return d;
 }

 const x=d instanceof Date?d:new Date(d);

 return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}

function fmt(d){
 const value=typeof d==='string'
  ?d
  :iso(d);

 if(/^\d{4}-\d{2}-\d{2}$/.test(value)){
  const [y,m,day]=value.split('-').map(Number);
  return `${String(day).padStart(2,'0')}.${String(m).padStart(2,'0')}`;
 }

 return new Date(d).toLocaleDateString('ru-RU',{
  day:'2-digit',
  month:'2-digit'
 });
}

async function saveSchedule(id){

 const teacherId=$('st')?.value;
 const studentId=$('su')?.value;
 const language=$('sl')?.value;
 const lessonDate=$('sd')?.value||'';
 const startTime=$('ss')?.value||'';
 const endTime=$('se')?.value||'';

 if(!lessonDate||!startTime||!endTime){
  alert('Укажите дату и время.');
  return;
 }

 const t=profile(teacherId);
 const s=profile(studentId);

 if(!t||!s||!language){
  alert('Выберите преподавателя, язык и ученика.');
  return;
 }

 if(currentUser.role==='teacher'&&String(t.id)!==String(currentUser.id)){
  alert('Можно создавать только свои занятия.');
  return;
 }

 if(!langsForTeacher(t).includes(language)){
  alert('Этот язык не назначен преподавателю.');
  return;
 }

 if(!langsForStudent(s).includes(language)){
  alert('Этот язык не назначен ученику.');
  return;
 }

 if(String(s.teacher_id)!==String(t.id)){
  alert('Этот ученик не привязан к выбранному преподавателю.');
  return;
 }

 const p={
  lesson_date:lessonDate,
  start_time:startTime,
  end_time:endTime,
  language,
  teacher_id:t.id,
  student_id:s.id
 };

 const r=id
  ?await sb.from('schedule').update(p).eq('id',id)
  :await sb.from('schedule').insert(p);

 if(r.error){
  alert(r.error.message);
  return;
 }

 closeModal();
 await reloadData();
 await render();
}

  alert(r.error.message);
  return;
 }

 await reloadData();
 await render();
}

async function saveHomework(id){

 const idsSelected=[
  ...document.querySelectorAll('#hstudents input:checked')
 ].map(x=>x.value);

 if(!idsSelected.length){
  alert('Выберите хотя бы одного ученика.');
  return;
 }

 if(id&&idsSelected.length!==1){
  alert('При изменении выберите ровно одного ученика.');
  return;
 }

 const teacherId=$('ht').value;
 const language=$('hl').value;
 const t=profile(teacherId);

 if(!t){
  alert('Преподаватель не найден.');
  return;
 }

 if(currentUser.role==='teacher'&&String(t.id)!==String(currentUser.id)){
  alert('Нельзя создавать ДЗ от имени другого преподавателя.');
  return;
 }

 if(!langsForTeacher(t).includes(language)){
  alert('Этот язык не назначен преподавателю.');
  return;
 }

 const valid=idsSelected.every(id=>{
  const s=profile(id);

  return s&&
   String(s.teacher_id)===String(t.id)&&
   langsForStudent(s).includes(language);
 });

 if(!valid){
  alert('Выбранный ученик не привязан к этому преподавателю или языку.');
  return;
 }

 const common={
  teacher_id:teacherId,
  language,
  title:$('hname').value.trim(),
  description:$('hdesc').value,
  due_date:$('hdue').value||null
 };

 const r=id
  ?await sb.from('homework')
    .update({
     ...common,
     student_id:idsSelected[0]
    })
    .eq('id',id)
  :await sb.from('homework')
    .insert(
     idsSelected.map(student_id=>({
      ...common,
      student_id
     }))
    );

 if(r.error){
  alert(r.error.message);
  return;
 }

 closeModal();
 await reloadData();
 await render();
}

function weightedAverage(rows){

 if(!rows.length)return 0;

 let sum=0;
 let weights=0;

 rows.forEach(g=>{
  const w=WT[g.type]??1;
  sum+=Number(g.value)*w;
  weights+=w;
 });

 return weights?sum/weights:0;
}

async function saveUser(id){

 if(currentUser.role!=='admin'){
  alert('Недостаточно прав.');
  return;
 }

 const role=$('ur').value;
 const name=$('uname').value.trim();

 const languages=[
  ...document.querySelectorAll('.ulang:checked')
 ].map(x=>x.value);

 const teacherId=role==='student'
  ?($('ut')?.value||null)
  :null;

 if(!name){
  alert('Введите имя.');
  return;
 }

 if((role==='teacher'||role==='student')&&!languages.length){
  alert('Выберите хотя бы один язык.');
  return;
 }

 if(id){

  const r=await sb
   .from('profiles')
   .update({
    full_name:name,
    role,
    languages,
    teacher_id:role==='student'?teacherId:null
   })
   .eq('id',id);

  if(r.error){
   alert(r.error.message);
   return;
  }

 }else{

  const email=$('ul').value.trim();
  const password=$('up').value;

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
   alert('Введите корректный email.');
   return;
  }

  if(password.length<6){
   alert('Пароль должен содержать минимум 6 символов.');
   return;
  }

  const {
   data:{session}
  }=await sb.auth.getSession();

  if(!session){
   alert('Сессия истекла.');
   return;
  }

  const r=await fetch(
   SUPABASE_URL+'/functions/v1/'+ADMIN_FUNCTION,
   {
    method:'POST',
    headers:{
     'Content-Type':'application/json',
     'Authorization':'Bearer '+session.access_token
    },
    body:JSON.stringify({
     action:'create',
     email,
     password,
     full_name:name,
     role,
     languages,
     teacher_id:teacherId
    })
   }
  );

  let j={};

  try{
   j=await r.json();
  }catch(e){}

  if(!r.ok){
   alert(j.error||j.message||'Ошибка создания');
   return;
  }
 }

 closeModal();
 await reloadData();
 await render();
}

  .select('*')
  .or(
   `and(user_a.eq.${a},user_b.eq.${b}),and(user_a.eq.${b},user_b.eq.${a})`
  )
  .order('created_at');

 if(error){
  console.error('CHAT:',error);
  return;
 }

 $('msgs').innerHTML=(data||[]).map(m=>`
  <div class="msg ${String(m.sender_id)===a?'mine':''}">
   ${esc(m.body)}
  </div>
 `).join('')||
 '<div class="empty">Нет сообщений</div>';

 $('msgs').scrollTop=$('msgs').scrollHeight;
}

async function sendChat(){

 const input=$('msg');
 const body=input?.value.trim();

 if(!body||!chatUser)return;

 const r=await sb.from('messages').insert({
  sender_id:currentUser.id,
  user_a:currentUser.id,
  user_b:chatUser,
  body
 });

 if(r.error){
  alert(r.error.message);
  return;
 }

 input.value='';
 await loadChatMessages();
}

/* CHECK HOMEWORK */

async function openCheckList(id){
 checkHw=id;
 await renderCheck();
}

async function renderCheck(){

 const h=homeworkRows.find(
  x=>String(x.id)===String(checkHw)
 );

 if(!h){
  $('content').innerHTML='<div class="empty">Выберите ДЗ</div>';
  return;
 }

 const s=profile(h.student_id);

 if(!s){
  $('content').innerHTML='<div class="empty">Ученик не найден</div>';
  return;
 }

 const sub=submissionFor(h.id,s.id);

 $('content').innerHTML=`
  <div class="card">
   <h3>${esc(h.title)}</h3>

   <div class="card">
    <b>${esc(s.full_name)}</b>

    <p>
     ${esc(sub?.answer||'Ответ не отправлен')}
    </p>

    ${
     sub?.link
      ?`
       <a href="${esc(sub.link)}"
        target="_blank" rel="noopener">
        Открыть ссылку
       </a>
      `
      :''
    }

    <br>

    <button class="btn sm"
     style="margin-top:8px"
     onclick="openCheck('${h.id}','${s.id}')">
     Проверить
    </button>
   </div>
  </div>
 `;
}

function openCheck(hid,sid){

 const sub=submissionFor(hid,sid);

 const g=gradeRows.find(x=>
  String(x.homework_id)===String(hid)&&
  String(x.student_id)===String(sid)
 );

 open(`
  <div class="modalhead">
   <h3>Проверка</h3>
   <button class="close" onclick="closeModal()">×</button>
  </div>

  <p>
   ${esc(sub?.answer||'Нет ответа')}
  </p>

  ${
   sub?.link
    ?`
     <p>
      <a href="${esc(sub.link)}"
       target="_blank" rel="noopener">
       Открыть ссылку ученика
      </a>
     </p>
    `
    :''
  }

  <label>Оценка</label>
  <input id="cv" type="number" min="1" max="5"
   value="${g?.value||''}">

  <label>Комментарий</label>
  <textarea id="cc">${esc(g?.comment||'')}</textarea>

  <button class="btn"
   onclick="finishCheck('${hid}','${sid}','${g?.id||''}')">
   Сохранить
  </button>
 `);
}

async function finishCheck(hid,sid,gid){

 const h=homeworkRows.find(
  x=>String(x.id)===String(hid)
 );

 const value=Number($('cv').value);

 if(!value||value<1||value>5){
  alert('Введите оценку от 1 до 5.');
  return;
 }

 if(!h){
  alert('ДЗ не найдено.');
  return;
 }

 const p={
  homework_id:hid,
  student_id:sid,
  teacher_id:h.teacher_id,
  language:h.language,
  type:'ДЗ',
  value,
  comment:$('cc').value
 };

 const r=gid
  ?await sb.from('grades').update(p).eq('id',gid)
  :await sb.from('grades').insert(p);

 if(r.error){
  alert(r.error.message);
  return;
 }

 closeModal();
 await reloadData();
 await render();
}

/* MODAL */

function open(html){

 $('modal').innerHTML=`
  <div class="modalbg">
   <div class="modal">
    ${html}
   </div>
  </div>
 `;

 $('modal').classList.remove('hidden');
}

function closeModal(){

 $('modal').classList.add('hidden');
 $('modal').innerHTML='';
}

window.addEventListener('click',e=>{
 if(e.target.classList.contains('modalbg')){
  closeModal();
 }
});

window.addEventListener('load',init);
</script>
