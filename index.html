async function tryIns(t, base, variants, ok){
  let err; for (const v of variants) { const {error} = await db.from(t).insert({...base, ...v}); if (!error) return refresh(ok); err = err || error; console.warn(t, v, error.message); }
  toast(err.message);
}

/* ---------- data ---------- */
async function load(){
  const r = await Promise.all([
    db.from('profiles').select('*'), db.from('languages').select('*'), db.from('schedule').select('*'),
    db.from('homework').select('*'), db.from('grades').select('*').order('created_at', {ascending:false}),
    db.from('teacher_languages').select('*'), db.from('homework_submissions').select('*'), db.from('groups').select('*'), db.from('group_members').select('*'), db.from('lan_messages').select('*').order('created_at', {ascending:false}).limit(300)]);
  const bad = r.slice(0, 7).find(x => x.error); if (bad) throw bad.error;
  const kc = c => { c = String(c || '').toLowerCase().slice(0, 2); return c === 'cn' ? 'zh' : c; };
  LG = r[1].data; [LANG, LGK].forEach(o => Object.keys(o).forEach(k => delete o[k]));
  LG.forEach(l => { l.key = kc(l.code) || l.name; LGK[l.key] = l; LANG[l.key] = l.name; });
  const key = x => {
    const l = LG.find(g => g.id === x.language_id) || (x.language && LG.find(g => g.name === x.language || kc(g.code) === kc(x.language)));
    const k = l ? l.key : (x.language || '—'); if (!LANG[k]) LANG[k] = x.language || k; return k;
  };
  P = Object.fromEntries(r[0].data.map(x => [x.id, x]));
  SUB = r[6].data; G = Object.fromEntries((r[7].data || []).map(g => [g.id, g.name]));
  GRP = (r[7].data || []).map(g => ({...g, language:g.language ? key(g) : null})); GM = r[8].data || [];
  CM = {}; (r[9].data || []).slice().reverse().forEach(m => (CM[m.channel] ||= []).push(m));
  const st = h => (SUB.find(s => s.homework_id === h.id && s.student_id === h.student_id) || {}).status || 'not_submitted';
  LES = r[2].data.filter(l => (l.lesson_date || l.date) && l.start_time && l.end_time).map(l => { const d = l.lesson_date || l.date; return {...l, language:key(l), starts_at:`${d}T${l.start_time}`, ends_at:`${d}T${l.end_time}`}; })
    .sort((a, b) => a.starts_at < b.starts_at ? -1 : 1);
  HW = r[3].data.map(h => ({...h, language:key(h), due_on:h.due_date, assigned_on:(h.created_at || '').slice(0, 10), status:st(h)}))
    .sort((a, b) => String(a.due_on) < String(b.due_on) ? -1 : 1);
  GR = r[4].data.map(g => { const k = g.grade_type || g.type || '—'; if (!KIND[k]) KIND[k] = [k, 1]; return {...g, language:key(g), kind:k, value:g.value ?? g.grade}; });
  TL = r[5].data.map(t => ({...t, language:(LG.find(l => l.id === t.language_id) || {}).key})).filter(t => t.language);
  if (me) {
    me.langs = TL.filter(t => t.teacher_id === me.id).map(t => t.language);
    if (!me.langs.length && Array.isArray(me.languages)) me.langs = me.languages.map(n => key({language:n}));
  }
}
async function boot(){
  if (booting) return; booting = true;
  try {
    const {data:{session}} = await db.auth.getSession();
    if (!session) { me = null; showAuth(); return; }
    const {data:pr, error} = await db.from('profiles').select('*').eq('id', session.user.id).single();
    if (error || !pr) throw error || new Error('Профиль не найден');
    me = pr; await load(); showApp();
  } catch (err) {
    showAuth(); const m = $('#aMsg'); m.className = 'msg'; m.textContent = 'Не удалось загрузить данные: ' + err.message;
  } finally { booting = false; }
}
db.auth.onAuthStateChange((ev, s) => {
  if (ev === 'SIGNED_OUT') { me = null; showAuth(); }
  else if (ev === 'SIGNED_IN' && (!me || me.id !== s.user.id)) setTimeout(boot, 0);
});

async function run(q, t){ const {error} = await q; if (error) return toast(error.message); refresh(t); }

/* ---------- schedule ---------- */
function chains(list){
  const out = [];
  list.forEach(l => {
    const c = out[out.length - 1], day = new Date(l.starts_at).toDateString();
    if (c && c.day === day && c.end === +new Date(l.starts_at)) { c.items.push(l); c.end = +new Date(l.ends_at); }
    else out.push({day, end:+new Date(l.ends_at), items:[l]});
  });
  return out;
}
const lessonWho = l => me.role === 'student' ? nm(l.teacher_id)
  : (l.group_id && !l.student_id ? 'Группа: ' + (G[l.group_id] || '') : (me.role === 'teacher' ? nm(l.student_id) : nm(l.teacher_id) + ' · ' + nm(l.student_id)));
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let wk = 0, sel = iso(new Date()), cuRole = 'student', lastCreated = null;
const lessonCard = (l, home) => `<div class="lcard t-${l.language}"><div class="lt">${home ? `<small>${new Date(l.starts_at).toLocaleDateString('ru', {day:'numeric', month:'short'})}</small>` : ''}<b>${fmtT(l.starts_at)}</b><span>${fmtT(l.ends_at)}</span></div>
  <div class="lb"><b>${e(LANG[l.language])}</b><small>${e(lessonWho(l))}${l.title ? ' · ' + e(l.title) : ''}</small></div>
  ${!home && isStaff() ? `<button class="btn del" onclick="delRow('schedule','${l.id}')">Удалить</button>` : ''}</div>`;
const chainHtml = (list, home) => chains(list).map(c => `<div class="lchain">${c.items.map(l => lessonCard(l, home)).join('')}</div>`).join('');
function weekDays(){
  const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + wk * 7);
  return [...Array(7)].map((_, i) => { const d = new Date(t); d.setDate(t.getDate() + i); return d; });
}
function pickDay(d){ sel = d; go('schedule'); }
function shiftWeek(n){ wk += n; sel = iso(wk === 0 ? new Date() : weekDays()[0]); go('schedule'); }
function scheduleView(){
  const days = weekDays(), today = iso(new Date()), at = k => LES.filter(l => l.starts_at.slice(0, 10) === k);
  const f = d => d.toLocaleDateString('ru', {day:'numeric', month:'long'});
  let html = '<h1>Расписание</h1><p class="sub">Выберите день недели. Уроки подряд собраны в одну группу.</p>';
  if (isStaff()) html += `<details class="card"><summary>Добавить занятие</summary><form onsubmit="return addLesson(event)">
    <div class="two"><div><label>Кому (группа или ученик)</label><select name="st" required>${whoOpts()}</select></div><div><label>Язык (для ученика)</label><select name="lg" required>${lgOpts()}</select></div>
    <div><label>Дата</label><input type="date" name="d" value="${sel}" required></div><div></div>
    <div><label>Начало</label><input type="time" name="s" required></div><div><label>Окончание</label><input type="time" name="t" required></div></div>
    <button class="btn" style="margin-top:18px">Добавить занятие</button></form></details>`;
  html += `<div class="wkhead"><button class="btn ghost" onclick="shiftWeek(-1)">Назад</button><b>${f(days[0])} — ${f(days[6])}</b><button class="btn ghost" onclick="shiftWeek(1)">Вперёд</button></div>
    <div class="week">${days.map(d => { const k = iso(d);
      return `<button class="dayb ${k === sel ? 'on' : ''} ${k === today ? 'today' : ''}" onclick="pickDay('${k}')"><small>${d.toLocaleDateString('ru', {weekday:'short'})}</small><b>${d.getDate()}</b><span class="dots">${[...new Set(at(k).map(l => l.language))].map(g => `<i class="c-${g}"></i>`).join('')}</span></button>`; }).join('')}</div>
    <div class="day">${fmtD(sel + 'T00:00')}</div>`;
  return html + (at(sel).length ? chainHtml(at(sel)) : '<div class="card empty">В этот день занятий нет.</div>');
}
function addLesson(ev){
  ev.preventDefault(); const f = new FormData(ev.target), d = f.get('d'), s = f.get('s'), t = f.get('t'), [kind, who] = f.get('st').split(':');
  if (t <= s) { toast('Окончание должно быть позже начала'); return false; }
  tryIns('schedule', {...(kind === 'g' ? groupRow(who) : rowOf(who, f.get('lg'))), start_time:s, end_time:t, created_by:me.id}, [{lesson_date:d, date:d}, {lesson_date:d}, {date:d}], 'Занятие добавлено');
  return false;
}
const delRow = (t, id) => confirm('Удалить запись?') && run(db.from(t).delete().eq('id', id), 'Удалено');

function addGrade(ev){
  ev.preventDefault(); const f = new FormData(ev.target), k = f.get('kind'), v = +f.get('v');
  tryIns('grades', {...rowOf(f.get('st'), f.get('lg')), comment:f.get('c') || null, what:f.get('c') || k},

  return false;
}

/* ---------- homework ---------- */
let hwF = 'all', hwTab = 'check';
const subOf = h => SUB.find(s => s.homework_id === h.id && s.student_id === h.student_id);
const bkey = h => h.batch_id || h.id;
const SI = {not_submitted:'○', submitted:'●', checked:'✓', returned:'↩'};
const lateOf = h => h.status === 'not_submitted' && h.due_on < iso(new Date());
const GV = (k, v) => [{grade_type:k, type:k, value:v, grade:v}, {grade_type:k, value:v}, {grade_type:k, grade:v}, {type:k, grade:v}, {type:k, value:v}];

function hwForm(){
  return `<details class="card"><summary>＋ Создать задание</summary><form onsubmit="return addHw(event)">
  <label>Группы (задание получат все участники)</label><div class="chk">${myGroups().map(g => `<label><input type="checkbox" name="tg" value="${g.id}">${dot(g.language)}${e(g.name)}</label>`).join('') || '<span class="empty">Групп пока нет — создайте во вкладке «Группы»</span>'}</div>
  <label>Отдельные ученики</label><div class="chk" style="max-height:130px;overflow:auto">${myStudents().map(p => `<label><input type="checkbox" name="st" value="${p.id}">${e(p.full_name)}</label>`).join('') || '<span class="empty">Нет учеников</span>'}</div>
  <div class="two"><div><label>Язык (для отдельных учеников)</label><select name="lg" required>${lgOpts()}</select></div><div><label>Срок сдачи</label><input type="date" name="due" required></div></div>
  <label>Название</label><input name="title" required maxlength="120"><label>Описание</label><textarea name="desc" rows="3"></textarea>
  <button class="btn" style="margin-top:18px">Выдать задание</button></form></details>`;
}
function homeworkView(){
  const html = '<h1>Домашняя работа</h1><p class="sub">' + (isStaff() ? 'Задания по группам и индивидуально. Проверка — по вкладке «На проверку».' : 'Задания, сроки и сдача с фото.') + '</p>' + (isStaff() ? hwForm() : '');
  if (!HW.length) return html + '<div class="card empty">Заданий пока нет.</div>';
  return html + (isStaff() ? staffHw() : studentHw());
}
function staffHw(){
  const all = Object.values(HW.reduce((m, h) => ((m[bkey(h)] ||= []).push(h), m), {}));
  const gids = [...new Set(HW.map(h => h.group_id).filter(Boolean))];
  const nc = HW.filter(h => h.status === 'submitted').length;
  let list = all.filter(b => hwF === 'all' || (hwF === 'solo' ? !b[0].group_id : b[0].group_id === hwF));
  if (hwTab === 'check') list = list.filter(b => b.some(h => h.status === 'submitted'));
  list.sort((a, b) => String(a[0].due_on) < String(b[0].due_on) ? -1 : 1);
  return `<div class="seg"><button class="${hwTab === 'check' ? 'on' : ''}" onclick="hwTab='check';go('homework')">На проверку${nc ? ' · ' + nc : ''}</button><button class="${hwTab === 'all' ? 'on' : ''}" onclick="hwTab='all';go('homework')">Все задания</button></div>
  <div class="filters">${[['all', 'Все'], ...gids.map(g => [g, '👥 ' + (G[g] || 'Группа')]), ['solo', '👤 Индивидуальные']].map(([k, t]) => `<button class="fchip ${hwF === k ? 'on' : ''}" onclick="hwF='${k}';go('homework')">${e(t)}</button>`).join('')}</div>
  ${list.length ? list.map(batchCard).join('') : `<div class="card empty">${hwTab === 'check' ? 'Работ на проверку нет 🎉' : 'Заданий нет.'}</div>`}`;
}
function batchCard(b){
  const h = b[0], n = b.length, ch = b.filter(x => x.status === 'checked').length, sb = b.filter(x => x.status === 'submitted').length, k = bkey(h);
  const who = h.group_id ? '👥 ' + e(G[h.group_id] || 'Группа') : '👤 ' + e(nm(h.student_id));
  return `<div class="card hwc t-${h.language}"><div class="row" style="border:0;padding:0 0 6px"><div class="grow"><h3 style="margin:0">${dot(h.language)}${e(h.title)}</h3><small class="lbl">${e(LANG[h.language])} · ${who} · срок ${h.due_on ? fmtS(h.due_on) : '—'}</small></div>
    <span class="pill ${sb ? 'kr' : ''}">${sb ? sb + ' на проверку' : ch + '/' + n + ' принято'}</span></div>
    ${h.description ? `<p>${e(h.description)}</p>` : ''}
    <div class="bar"><i class="ok" style="width:${ch / n * 100}%"></i><i class="wt" style="width:${sb / n * 100}%"></i></div>
    <div class="chips">${b.map(x => `<button class="chip s-${x.status} ${lateOf(x) ? 'late' : ''}" onclick="reviewHw('${x.id}')">${SI[x.status]} ${e(nm(x.student_id))}</button>`).join('')}</div>
    <div class="acts"><button class="btn ghost" onclick="editHw('${k}')">Изменить</button><button class="btn del" onclick="delHw('${k}')">Удалить</button></div></div>`;
}
function studentHw(){
  const rank = h => h.status === 'checked' ? 2 : h.status === 'submitted' ? 1 : 0;
  return [...HW].sort((a, b) => rank(a) - rank(b) || (String(a.due_on) < String(b.due_on) ? -1 : 1)).map(h => {
    const s = subOf(h), can = h.status === 'not_submitted' || h.status === 'returned';
    return `<div class="card hwc t-${h.language}"><div class="row" style="border:0;padding:0 0 6px"><div class="grow"><h3 style="margin:0">${dot(h.language)}${e(h.title)}</h3><small class="lbl">${e(LANG[h.language])}${h.group_id ? ' · 👥 ' + e(G[h.group_id] || 'Группа') : ''} · срок ${h.due_on ? fmtS(h.due_on) : '—'}</small></div>
      <span class="pill s-${h.status}">${lateOf(h) ? 'Просрочено' : SUBST[h.status]}</span></div>
      ${h.description ? `<p>${e(h.description)}</p>` : ''}
      ${s && s.feedback ? `<div class="fb"><b>Комментарий учителя</b>${e(s.feedback)}</div>` : ''}
      ${s && s.comment && h.status === 'submitted' ? `<p class="lbl" style="margin-top:8px">Ваш комментарий: ${e(s.comment)}</p>` : ''}
      <div class="acts">${can ? `<button class="btn" onclick="openSubmit('${h.id}')">${h.status === 'returned' ? '↩ Пересдать' : '📤 Сдать ДЗ'}</button>` : h.status === 'submitted' ? `<button class="btn ghost" onclick="openSubmit('${h.id}')">Изменить сдачу</button>` : ''}</div></div>`;
  }).join('');
}
function addHw(ev){

function confetti(){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c = $('#fx'), x = c.getContext('2d'), cols = ['#3B6BFF', '#FF5A4F', '#16B38A', '#FFA620', '#D3F54A'];
  c.width = innerWidth; c.height = innerHeight; c.classList.remove('hide');
  const p = [...Array(130)].map(() => ({x:innerWidth / 2, y:innerHeight * .65, vx:(Math.random() - .5) * 18, vy:-Math.random() * 17 - 4, s:6 + Math.random() * 6, c:cols[Math.random() * 5 | 0], r:Math.random() * 6}));
  let n = 0;
  (function t(){ x.clearRect(0, 0, c.width, c.height); p.forEach(q => { q.x += q.vx; q.y += q.vy; q.vy += .45; q.r += .2; x.fillStyle = q.c; x.save(); x.translate(q.x, q.y); x.rotate(q.r); x.fillRect(-q.s / 2, -q.s / 2, q.s, q.s * .6); x.restore(); });
    if (++n < 110) requestAnimationFrame(t); else c.classList.add('hide'); })();
}

function groupsView(){
  const gs = myGroups(), ts = Object.values(P).filter(p => p.role === 'teacher');
  let html = '<h1>Группы</h1><p class="sub">' + (isStaff() ? 'У группы общее расписание, общие задания и свой чат.' : 'Ваши группы.') + '</p>';
  if (isStaff()) html += `<details class="card"><summary>＋ Создать группу</summary><form onsubmit="return addGroup(event)">
    <div class="two"><div><label>Название</label><input name="n" required maxlength="60" placeholder="English B1 · вечер"></div><div><label>Язык</label><select name="lg" required>${lgOpts()}</select></div></div>
    ${me.role === 'admin' ? `<label>Учитель</label><select name="t" required>${ts.map(p => `<option value="${p.id}">${e(p.full_name)}</option>`).join('')}</select>` : ''}
    <label>Ученики</label><div class="chk" style="max-height:150px;overflow:auto">${myStudents().map(p => `<label><input type="checkbox" name="m" value="${p.id}">${e(p.full_name)}</label>`).join('') || '<span class="empty">Нет учеников</span>'}</div>
    <button class="btn" style="margin-top:18px">Создать группу</button></form></details>`;
  if (!gs.length) return html + '<div class="card empty">Групп пока нет.</div>';
  return html + gs.map(g => {
    const ms = members(g.id), out = myStudents().filter(s => !ms.includes(s.id));
    return `<div class="card hwc t-${g.language}"><div class="row" style="border:0;padding:0 0 6px"><div class="grow"><h3 style="margin:0">${dot(g.language)}${e(g.name)}</h3><small class="lbl">${e(LANG[g.language] || '')} · учитель: ${e(nm(g.teacher_id))} · ${ms.length} уч.</small></div><button class="btn ghost" onclick="openChat('g:${g.id}')">💬 Чат</button></div>
      <div class="chips">${ms.map(s => `<span class="chip s-plain">${e(nm(s))}${isStaff() ? `<a onclick="rmMember('${g.id}','${s}')" title="Убрать">✕</a>` : ''}</span>`).join('') || '<span class="empty">В группе пока никого</span>'}</div>
      ${isStaff() ? `<div class="acts"><select id="am_${g.id}" style="width:auto;flex:1;min-width:160px"><option value="">Добавить ученика…</option>${out.map(s => `<option value="${s.id}">${e(s.full_name)}</option>`).join('')}</select><button class="btn ghost" onclick="addMember('${g.id}')">Добавить</button><button class="btn del" onclick="delGroup('${g.id}')">Удалить группу</button></div>` : ''}</div>`;
  }).join('');
}
async function addGroup(ev){
  ev.preventDefault(); const f = new FormData(ev.target), l = LGK[f.get('lg')];
  const {data, error} = await db.from('groups').insert({name:f.get('n').trim(), language:l.name, teacher_id:me.role === 'admin' ? f.get('t') : me.id, created_by:me.id}).select().single();
  if (error) { toast(error.message); return false; }
  const ms = f.getAll('m'); if (ms.length) { const r = await db.from('group_members').insert(ms.map(s => ({group_id:data.id, student_id:s}))); if (r.error) toast(r.error.message); }
  await refresh('Группа создана 🎉'); return false;
}
function addMember(gid){ const s = $('#am_' + gid).value; if (s) run(db.from('group_members').insert({group_id:gid, student_id:s}), 'Ученик добавлен'); }
const rmMember = (gid, sid) => run(db.from('group_members').delete().eq('group_id', gid).eq('student_id', sid), 'Ученик убран из группы');
const delGroup = gid => confirm('Удалить группу? Расписание и задания группы нужно удалить отдельно.') && run(db.from('groups').delete().eq('id', gid), 'Группа удалена');

/* ---------- right rail ---------- */
let rmo = 0;
function railPick(k){ const mon = d => { const t = new Date(d + 'T00:00'); t.setDate(t.getDate() - (t.getDay() + 6) % 7); return t; }; wk = Math.round((mon(k) - mon(iso(new Date()))) / 6048e5); sel = k; go('schedule'); }
function drawRail(){
  const now = new Date(), today = iso(now), base = new Date(now.getFullYear(), now.getMonth() + rmo, 1), y = base.getFullYear(), m = base.getMonth();
  const off = (base.getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  let cells = '<span></span>'.repeat(off);
  for (let d = 1; d <= n; d++) { const k = iso(new Date(y, m, d)), ls = [...new Set(LES.filter(l => l.starts_at.slice(0, 10) === k).map(l => l.language))];
    cells += `<button class="cd ${k === today ? 'today' : ''} ${k === sel ? 'sel' : ''}" onclick="railPick('${k}')">${d}<span class="dots">${ls.slice(0, 3).map(g => `<i class="c-${g}"></i>`).join('')}</span></button>`; }
  const tl = LES.filter(l => l.starts_at.slice(0, 10) === today), seen = new Set();
  const dl = HW.filter(h => h.status !== 'checked' && h.due_on >= today && !seen.has(bkey(h)) && seen.add(bkey(h))).sort((a, b) => String(a.due_on) < String(b.due_on) ? -1 : 1).slice(0, 4);
  $('#rail').innerHTML = `<div class="card"><div class="wkhead"><button class="btn ghost" onclick="rmo--;drawRail()">‹</button><b style="text-transform:capitalize">${base.toLocaleDateString('ru', {month:'long', year:'numeric'})}</b><button class="btn ghost" onclick="rmo++;drawRail()">›</button></div>
    <div class="cal">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<b>${d}</b>`).join('')}${cells}</div></div>
  <div class="card"><h3>Сегодня</h3>${tl.map(l => `<div class="row"><span class="pill" style="background:color-mix(in srgb,var(--${l.language},#6B7280) 18%,#fff)">${fmtT(l.starts_at)}</span><div class="grow"><b>${e(LANG[l.language])}</b><small>${e(lessonWho(l))}</small></div></div>`).join('') || '<div class="empty" style="padding:4px 0">Занятий нет — отдыхаем 😌</div>'}</div>
  <div class="card"><h3>Ближайшие сроки</h3>${dl.map(h => `<div class="row" style="cursor:pointer" onclick="go('homework')"><div class="grow"><b>${dot(h.language)}${e(h.title)}</b><small>${h.group_id ? '👥 ' + e(G[h.group_id] || '') : isStaff() ? e(nm(h.student_id)) : e(LANG[h.language])}</small></div><span class="pill">${fmtS(h.due_on)}</span></div>`).join('') || '<div class="empty" style="padding:4px 0">Всё сдано 🎉</div>'}</div>`;
}

/* ---------- chat ---------- */
let chCur = null, LR = {}, rt = null;
const dmId = o => 'd:' + [me.id, o].sort().join(':');
const hue = s => ['#3B6BFF', '#FF5A4F', '#16B38A', '#FFA620', '#8B5CF6', '#EC4899'][[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % 6];
const ini = n => (n || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
const lastMsg = ch => (CM[ch] || [])[(CM[ch] || []).length - 1];
const unr = ch => (CM[ch] || []).filter(m => m.sender_id !== me.id && m.created_at > (LR[ch] || '')).length;
const unrAll = () => Object.keys(CM).reduce((a, c) => a + unr(c), 0);
function chans(){
  const gs = myGroups().map(g => ({id:'g:' + g.id, t:g.name, s:'Группа · ' + (LANG[g.language] || ''), ic:'👥', c:`var(--${g.language}, #6B7280)`}));
  const room = isStaff() ? [{id:'s:staff', t:'Учительская', s:'Все учителя и администраторы', ic:'🏫', c:'#111827'}] : [];
  const ids = new Set(Object.keys(CM).filter(c => c[0] === 'd').map(c => c.split(':').slice(1).find(i => i !== me.id)));
  if (me.role === 'student') [me.teacher_id, ...myGroups().map(g => g.teacher_id)].forEach(i => i && ids.add(i));
  else Object.keys(P).forEach(i => ids.add(i));
  ids.delete(me.id);
  return [...room, ...gs, ...[...ids].map(i => P[i]).filter(Boolean).map(p => ({id:dmId(p.id), t:p.full_name || 'Без имени', s:ROLE[p.role], ic:ini(p.full_name), c:hue(p.id)}))];
}
function chatView(){
  const cs = chans().sort((a, b) => String((lastMsg(b.id) || {}).created_at || '').localeCompare(String((lastMsg(a.id) || {}).created_at || ''))), cur = cs.find(c => c.id === chCur);
  return `<h1>Чат</h1><p class="sub">Личные сообщения и чаты групп. Новые сообщения приходят сразу.</p>
  <div class="chat ${cur ? 'open' : ''}"><div class="clist">${cs.map(c => { const u = unr(c.id), l = lastMsg(c.id);
    return `<button class="ci ${c.id === chCur ? 'on' : ''}" onclick="openChat('${c.id}')"><span class="av" style="background:${c.c}">${e(c.ic)}</span><span class="grow"><b>${e(c.t)}</b><small>${l ? e(l.body.slice(0, 40)) : e(c.s)}</small></span>${u ? `<span class="nb">${u}</span>` : ''}</button>`; }).join('') || '<div class="empty" style="padding:14px">Пока нет собеседников.</div>'}</div>
  <div class="cpane">${cur ? `<div class="chead"><button class="btn ghost back" onclick="chCur=null;go('chat')">←</button><span class="av" style="background:${cur.c}">${e(cur.ic)}</span><div><b>${e(cur.t)}</b><small class="lbl" style="display:block">${e(cur.s)}</small></div></div>
    <div class="msgs" id="msgs">${msgsHtml()}</div>
    <div class="emo">${['👍', '🔥', '😂', '🎉', '❤️'].map(x => `<button type="button" onclick="postMsg('${x}')">${x}</button>`).join('')}</div>
    <form class="comp" onsubmit="return sendMsg(event)"><input id="mIn" placeholder="Сообщение…" autocomplete="off" maxlength="1000"><button class="btn lime">➤</button></form>` : '<div class="nochat"><div style="font-size:42px">💬</div>Выберите чат слева</div>'}</div></div>`;
}
function msgsHtml(){
  const g = chCur && 'gs'.includes(chCur[0]), l = CM[chCur] || [];
  return l.length ? l.map(m => `<div class="bub ${m.sender_id === me.id ? 'me' : ''}">${g && m.sender_id !== me.id ? `<b>${e(nm(m.sender_id))}</b>` : ''}${e(m.body)}<small>${fmtT(m.created_at)}</small></div>`).join('') : '<div class="nochat">Напишите первое сообщение 👋</div>';
}
function markRead(c){ const l = lastMsg(c); if (l) { LR[c] = l.created_at; try { localStorage.setItem('lr_' + me.id, JSON.stringify(LR)); } catch (_) {} } drawNav(); }
function openChat(c){ chCur = c; markRead(c); go('chat'); const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; const i = $('#mIn'); if (i && innerWidth > 820) i.focus(); }
async function sendMsg(ev){ ev.preventDefault(); const i = $('#mIn'), b = i.value.trim(); if (b) { i.value = ''; await postMsg(b); } return false; }
async function postMsg(body){
  const {data, error} = await db.from('lan_messages').insert({channel:chCur, sender_id:me.id, body}).select().single();
  if (error) return toast(/messages/.test(error.message) ? 'Чат не настроен: выполните setup.sql в Supabase' : error.message);
  onMsg(data);
}
function onMsg(m){
  const l = (CM[m.channel] ||= []); if (l.some(x => x.id === m.id)) return; l.push(m);
  if (page === 'chat' && chCur === m.channel) { const el = $('#msgs'); if (el) { el.innerHTML = msgsHtml(); el.scrollTop = el.scrollHeight; } markRead(m.channel); }
  else { drawNav(); if (m.sender_id !== me.id) { toast('💬 ' + nm(m.sender_id) + ': ' + m.body.slice(0, 50)); if (page === 'chat' && !($('#mIn') || {}).value) go('chat'); } }
}

const VIEWS = {home:homeView, schedule:scheduleView, grades:gradesView, homework:homeworkView, students:studentsView, teachers:teachersView, users:usersView, create:createView, settings:settingsView, groups:groupsView, chat:chatView};
boot();
</script>
